schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  exported_at: '2026-11-03T19:27:57+00:00'
  exported_by: admin
  source_workflow_id: security_monthly_20438
  portability_kind: workflow_bundle
  flow_steward_version: 0.9.9
  triggers: []
workflows:
- workflow_id: security_monthly_20438
  version: 0.1.0
  display_name: Monthly security incident review
  description: 'Prepare a monthly incident summary and AI review for security operations.
    Adapted from https://n8n.io/workflows/20438/. Offline executor qualification:
    20 source scenarios passed with synthetic provider/model replies; no live API
    or import verification. Disabled on import. Configure released Google Workspace
    0.3.3 and Outgoing Email/SMTP 0.3.1 connections and an AI model. Complete reads
    are limited to 100 rows per table; use dedicated contiguous plain-value tables
    and one writer. SMTP replaces Gmail sending. Source forms/schedules and trusted
    current-time inputs require separate setup; only callable workflow structure is
    included. Select the model, validate setup and enable any included agents, skills
    and child workflows before enabling the main workflow.'
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      strict_inputs: false
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
      expected_inputs:
      - name: setup_ready
        type: boolean
        required: false
      - name: spreadsheet_id
        type: text
        required: false
      - name: google_connection
        type: text
        required: false
      - name: smtp_connection
        type: text
        required: false
      - name: supervisor_email
        type: text
        required: false
      - name: client_email
        type: text
        required: false
      - name: run_timestamp
        type: text
        required: false
      - name: report_id
        type: text
        required: false
      - name: window_start
        type: text
        required: false
  participants: []
  tags:
  - migration
  - security-patrol
  steps:
  - step_id: setup
    step_kind: template
    error_policy:
      on_error: route_to_step
    override:
      template:
        text: '{{ ''yes'' if ready|default(false) and sheet|default('''') and google|default('''')
          and smtp|default('''') and supervisor|default('''') and client|default('''')
          and rid|default('''') and clock|default('''') else ''no'' }}'
        format: text
        inputs:
        - name: ready
          type: boolean
          required: false
          source: state.inputs.setup_ready
        - name: sheet
          type: text
          required: false
          source: state.inputs.spreadsheet_id
        - name: google
          type: text
          required: false
          source: state.inputs.google_connection
        - name: smtp
          type: text
          required: false
          source: state.inputs.smtp_connection
        - name: supervisor
          type: text
          required: false
          source: state.inputs.supervisor_email
        - name: client
          type: text
          required: false
          source: state.inputs.client_email
        - name: rid
          type: text
          required: false
          source: state.inputs.report_id
        - name: clock
          type: text
          required: false
          source: state.inputs.run_timestamp
        result_target: state.setup_ok
  - step_id: setup_guard
    step_kind: if
    override:
      if:
        condition:
          selector: state.setup_ok
          operator: equals
          value: 'yes'
  - step_id: read_config
    step_kind: set_variable
    error_policy:
      on_error: route_to_step
    override:
      set_variable:
        assignments:
          state.sheet_title: Security Log
  - step_id: read
    step_kind: connector
    connector_id: extension.flowsteward.google-workspace
    input_mapping_jsonb:
      connection_ref: state.inputs.google_connection
      spreadsheet_id: state.inputs.spreadsheet_id
      sheet_title: state.sheet_title
    output_mapping_jsonb:
      result.preview: state.log_rows
      result.row_count: state.log_count
    error_policy:
      on_error: route_to_step
    override:
      connector:
        operation_id: read_google_sheet
        extension_id: flowsteward.google-workspace
  - step_id: coverage
    step_kind: template
    error_policy:
      on_error: route_to_step
    override:
      template:
        text: '{{ ''yes'' if count <= 100 and rows|length == count and start|default('''')
          and finish|default('''') and start < finish else ''no'' }}'
        format: text
        inputs:
        - name: count
          type: number
          required: false
          source: state.log_count
        - name: rows
          type: array
          required: false
          source: state.log_rows
        - name: start
          type: text
          required: false
          source: state.inputs.window_start
        - name: finish
          type: text
          required: false
          source: state.inputs.run_timestamp
        result_target: state.coverage_ok
  - step_id: coverage_guard
    step_kind: if
    override:
      if:
        condition:
          selector: state.coverage_ok
          operator: equals
          value: 'yes'
  - step_id: digest
    step_kind: template
    error_policy:
      on_error: route_to_step
    override:
      template:
        text: '{% set fresh = rows|selectattr(''reported_at'',''ge'',start)|selectattr(''reported_at'',''le'',finish)|selectattr(''report_id'')|list
          %}{% if fresh %}Monthly security review - {{ finish[:7] }}

          Total reports: {{ fresh|length }}

          Urgent: {{ fresh|selectattr(''is_urgent'',''equalto'',''yes'')|list|length
          }}

          {% set ns = namespace(incidents=0) %}{% for r in fresh %}{% if ''incident''
          in r.report_type|lower %}{% set ns.incidents = ns.incidents + 1 %}{% endif
          %}{% endfor %}Incidents: {{ ns.incidents }}

          Reports by site: {% for group in fresh|groupby(''site'') %}{{ group.grouper
          }}: {{ group.list|length }}; {% endfor %}

          {% for r in fresh %}{{ r.reported_at }} | {{ r.site }} | {{ r.officer_name
          }} | {{ r.report_type }} | {{ r.severity }} | {{ r.summary }}

          {% endfor %}{% endif %}'
        format: text
        inputs:
        - name: rows
          type: array
          required: false
          source: state.log_rows
        - name: start
          type: text
          required: false
          source: state.inputs.window_start
        - name: finish
          type: text
          required: false
          source: state.inputs.run_timestamp
        result_target: state.digest
  - step_id: empty_guard
    step_kind: if
    override:
      if:
        condition:
          selector: state.digest
          operator: equals
          value: ''
  - step_id: review
    step_kind: agent
    agent_id: security_monthly_writer
    skill_id: security_monthly_review
    input_mapping_jsonb:
      monthly_evidence: state.digest
    output_mapping_jsonb:
      subject: state.review_subject
      body: state.review_body
    error_policy:
      on_error: route_to_step
  - step_id: review_check
    step_kind: template
    error_policy:
      on_error: route_to_step
    override:
      template:
        text: '{{ ''yes'' if subject is string and subject|trim and body is string
          and body|trim else ''no'' }}'
        format: text
        inputs:
        - name: subject
          type: json
          required: false
          source: state.review_subject
        - name: body
          type: json
          required: false
          source: state.review_body
        result_target: state.review_ok
  - step_id: review_guard
    step_kind: if
    override:
      if:
        condition:
          selector: state.review_ok
          operator: equals
          value: 'yes'
  - step_id: digest_mail
    step_kind: connector
    connector_id: extension.flowsteward.outgoing-email
    input_mapping_jsonb:
      connection_ref: state.inputs.smtp_connection
      to: state.inputs.supervisor_email
      subject: state.review_subject
      body_text: state.review_body
    output_mapping_jsonb:
      delivered: state.digest_mail_delivered
      provider_message_id: state.digest_mail_message_id
    error_policy:
      on_error: route_to_step
    override:
      connector:
        operation_id: send_email
        extension_id: flowsteward.outgoing-email
  - step_id: done
    step_kind: stop_success
    override:
      stop_success:
        message: Completed
  - step_id: failed
    step_kind: stop_fail
    override:
      stop_fail:
        message: Setup, data contract or provider failed; inspect effects before retry
  groups: []
  for_each: []
  execution_graph:
    schema_version: 1
    entry:
