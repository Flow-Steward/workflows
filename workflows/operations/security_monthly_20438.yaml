dependencies:
  agents:
  - agent_id: security_monthly_writer
    display_name: security_monthly_writer
    required: true
    sources:
    - review
    description: 'You are the operations assistant at a private security company.
      Write the monthly security review email for the ops manager. Use ONLY the supplied
      data. Write 3 to 5 plain sentences: the total number of reports, how many were
      incidents and how many urgent, which sites had the most activity, and one practical
      suggestion (extra patrols, camera check, briefing). If there were urgent incidents,
      name the site in one short line. No markdown, no bullets, no em dashes, under
      140 words. Return ONLY valid JSON with exactly these keys: subject (max 10 words)
      and body (the full email).'
    version: 0.1.0
    enabled: false
  skills:
  - skill_id: security_monthly_review
    display_name: security_monthly_review
    required: true
