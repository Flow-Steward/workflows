schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  exported_at: '2026-11-04T07:03:10+00:00'
  exported_by: admin
  source_workflow_id: m5_order_failsafe
  portability_kind: workflow_bundle
  flow_steward_version: 0.9.9
  triggers: []
workflows:
- workflow_id: m5_order_failsafe
  version: 1.0.0
  display_name: Order export protocol with a durable queue
  description: 'Adapted protocol example: validate orders, route shipping-method decisions,
    and call source-compatible demo order/ops HTTP endpoints. This is not a real 3PL
    integration. Qualified with core 0.9.9 and PostgreSQL extension 1.4.0; latest
    catalog 1.4.1 was not qualified. Required SQL setup: https://github.com/Flow-Steward/workflows/blob/main/docs/templates/m5_order_failsafe/queue-schema.sql
    . Setup and limitations: https://github.com/Flow-Steward/workflows/blob/main/docs/templates/m5_order_failsafe/README.md
    . Use a dedicated project with concurrency_cap=1, trusted immutable delivery identity/scope
    and one active invocation per delivery. Reconcile uncertain creates manually before
    approval. Replace demo endpoints and configure a trusted webhook adapter. Disabled
    on import; no exactly-once or exact Make parity claim.'
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      strict_inputs: true
      expected_inputs:
      - name: setup_confirmed
        type: boolean
        required: true
        description: Operator has completed the linked setup guide, SQL schema, endpoint
          review and trusted adapter configuration.
      - name: tenant_id
        type: string
        required: true
        description: Configured tenant ID; must equal the immutable host tenant scope
          before any SQL.
      - name: project_id
        type: string
        required: true
        description: Configured dedicated project ID; must equal immutable host project
          scope. Set project concurrency_cap=1.
      - name: delivery_id
        type: string
        required: true
        description: Immutable ID for this received event. Preserve on recovery; use
          one active invocation per delivery. Do not use order_ref for deduplication.
      - name: db_connection
        type: string
        required: true
        description: Project-permitted PostgreSQL SQL-writer connection with the published
          companion schema. Qualified extension version 1.4.0; requalify other versions.
      - name: order
        type: object
        required: true
        description: Source-compatible order object. Customer, address and full ordered
          lines remain typed. A delivery ID cannot be reused with a different payload.
      - name: poll_wait_ms
        type: integer
        required: true
        description: Positive wait in milliseconds while an earlier order remains
          unfinished; repeated polls may request native rework-budget approval.
      - name: validation_retry_wait_ms
        type: integer
        required: true
        description: Positive validation retry delay in milliseconds. Review source
          15-minute interpretation before choosing 900000.
      - name: mapping_retry_wait_ms
        type: integer
        required: true
        description: Positive shipping-map retry delay in milliseconds. Review source
          15-minute interpretation before choosing 900000.
      - name: create_retry_wait_ms
        type: integer
        required: true
        description: Positive create retry delay in milliseconds. Review source 30-minute
          interpretation before choosing 1800000. Reconcile uncertain create effects.
      expected_outputs: []
      trigger_channels:
      - api
      - parent_workflow
    portability:
      import_state: draft
    participants: []
  participants: []
  tags:
  - fulfillment
  - migration
  steps:
  - step_id: check_setup
    step_kind: template
    display_name: check setup
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ ''valid'' if confirmed is sameas true and tenant == trusted_tenant
          and project == trusted_project and delivery is string and 0 < delivery|length
          <= 255 and tenant is string and tenant|length > 0 and project is string
          and project|length > 0 and poll is integer and poll > 0 and vr is integer
          and vr > 0 and mr is integer and mr > 0 and cr is integer and cr > 0 else
          ''invalid'' }}'
        format: text
        inputs:
        - name: trusted_tenant
          type: json
          source: state.tenant_id
          required: true
        - name: trusted_project
          type: json
          source: state.project_id
          required: true
        - name: confirmed
          type: json
          source: state.inputs.setup_confirmed
          required: true
        - name: delivery
          type: json
          source: state.inputs.delivery_id
          required: true
        - name: tenant
          type: json
          source: state.inputs.tenant_id
          required: true
        - name: project
          type: json
          source: state.inputs.project_id
          required: true
        - name: poll
          type: json
          source: state.inputs.poll_wait_ms
          required: true
        - name: vr
          type: json
          source: state.inputs.validation_retry_wait_ms
          required: true
        - name: mr
          type: json
          source: state.inputs.mapping_retry_wait_ms
          required: true
        - name: cr
          type: json
          source: state.inputs.create_retry_wait_ms
          required: true
        result_target: state.check_setup
  - step_id: require_setup
    step_kind: if
    display_name: require setup
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          selector: state.check_setup
          operator: equals
          value: valid
  - step_id: initialize
    step_kind: set_variable
    display_name: initialize
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.sql_contracts:
            init_scope:
              sql: INSERT INTO migration_order_failsafe.scope_admission(tenant_id,project_id)
                VALUES(:tenant,:project) ON CONFLICT(tenant_id,project_id) DO NOTHING
              param_schema:
                type: object
                properties:
                  tenant:
                    type: string
                  project:
                    type: string
                required:
                - tenant
                - project
            admit:
              sql: 'INSERT INTO migration_order_failsafe.order_journal(tenant_id,project_id,event_id,payload_json)

                SELECT :tenant,:project,:event,:payload::jsonb FROM (SELECT tenant_id
                FROM migration_order_failsafe.scope_admission WHERE tenant_id=:tenant
                AND project_id=:project FOR UPDATE) admission

                ON CONFLICT(tenant_id,project_id,event_id) DO UPDATE SET event_id=excluded.event_id
                RETURNING status,(payload_json=:payload::jsonb) AS payload_matches'
              param_schema:
                type: object
                properties:
                  tenant:
                    type: string
                  project:
                    type: string
                  payload:
                    type: string
                  event:
                    type: string
                required:
                - tenant
                - project
                - payload
                - event
            claim:
              sql: 'UPDATE migration_order_failsafe.order_journal SET owner_job_id=:event,status=''active''

                WHERE tenant_id=:tenant AND project_id=:project AND event_id=:event
                AND admission_seq=(SELECT MIN(admission_seq) FROM migration_order_failsafe.order_journal
                WHERE tenant_id=:tenant AND project_id=:project AND status!=''done'')

                AND (owner_job_id IS NULL OR owner_job_id=:event) RETURNING payload_json,stage,retry_attempt,validate_response,map_response'
              param_schema:
                type: object
                properties:
                  tenant:
                    type: string
                  project:
                    type: string
                  event:
                    type: string
                required:
                - tenant
                - project
                - event
            store_validation:
              sql: UPDATE migration_order_failsafe.order_journal SET validate_response=:body::jsonb,stage='route_validate',retry_attempt=0
                WHERE tenant_id=:tenant AND project_id=:project AND event_id=:event
                AND owner_job_id=:event RETURNING stage
              param_schema:
                type: object
                properties:
                  tenant:
                    type: string
                  project:
                    type: string
                  body:
                    type: string
                  event:
                    type: string
                required:
                - tenant
                - project
                - body
                - event
            to_map:
              sql: UPDATE migration_order_failsafe.order_journal SET stage='map',retry_attempt=0
                WHERE tenant_id=:tenant AND project_id=:project AND event_id=:event
                AND owner_job_id=:event RETURNING stage
              param_schema:
                type: object
                properties:
                  tenant:
                    type: string
                  project:
                    type: string
                  event:
                    type: string
                required:
                - tenant
                - project
                - event
            store_mapping:
              sql: UPDATE migration_order_failsafe.order_journal SET map_response=:body::jsonb,stage='route_map',retry_attempt=0
                WHERE tenant_id=:tenant AND project_id=:project AND event_id=:event
                AND owner_job_id=:event RETURNING stage
              param_schema:
                type: object
                properties:
                  tenant:
                    type: string
                  project:
                    type: string
                  body:
                    type: string
                  event:
                    type: string
                required:
                - tenant
                - project
                - body
                - event
            to_create:
              sql: UPDATE migration_order_failsafe.order_journal SET stage='create',retry_attempt=0
                WHERE tenant_id=:tenant AND project_id=:project AND event_id=:event
                AND owner_job_id=:event RETURNING stage
              param_schema:
                type: object
                properties:
                  tenant:
                    type: string
                  project:
                    type: string
                  event:
                    type: string
                required:
                - tenant
                - project
                - event
            retry_validate:
              sql: UPDATE migration_order_failsafe.order_journal SET retry_attempt=retry_attempt+1,status='held'
                WHERE tenant_id=:tenant AND project_id=:project AND event_id=:event
                AND owner_job_id=:event RETURNING retry_attempt
              param_schema:
                type: object
                properties:
                  tenant:
                    type: string
                  project:
                    type: string
                  event:
                    type: string
                required:
                - tenant
                - project
                - event
            retry_map:
              sql: UPDATE migration_order_failsafe.order_journal SET retry_attempt=retry_attempt+1,status='held'
                WHERE tenant_id=:tenant AND project_id=:project AND event_id=:event
                AND owner_job_id=:event RETURNING retry_attempt
              param_schema:
                type: object
                properties:
                  tenant:
                    type: string
                  project:
                    type: string
                  event:
                    type: string
                required:
                - tenant
                - project
                - event
            retry_create:
              sql: UPDATE migration_order_failsafe.order_journal SET retry_attempt=retry_attempt+1,status='held'
                WHERE tenant_id=:tenant AND project_id=:project AND event_id=:event
                AND owner_job_id=:event RETURNING retry_attempt
              param_schema:
                type: object
                properties:
                  tenant:
                    type: string
                  project:
                    type: string
                  event:
                    type: string
                required:
                - tenant
                - project
                - event
            reset_budget:
              sql: UPDATE migration_order_failsafe.order_journal SET retry_attempt=0
                WHERE tenant_id=:tenant AND project_id=:project AND event_id=:event
                AND owner_job_id=:event RETURNING stage
              param_schema:
                type: object
                properties:
                  tenant:
                    type: string
                  project:
                    type: string
                  event:
                    type: string
                required:
                - tenant
                - project
                - event
            finish:
              sql: UPDATE migration_order_failsafe.order_journal SET status='done',stage='done',retry_attempt=0
                WHERE tenant_id=:tenant AND project_id=:project AND event_id=:event
                AND owner_job_id=:event RETURNING status
              param_schema:
                type: object
                properties:
                  tenant:
                    type: string
                  project:
                    type: string
                  event:
                    type: string
                required:
                - tenant
                - project
                - event
          state.sql_params:
            init_scope: {}
            admit: {}
            claim: {}
            store_validation: {}
            to_map: {}
            store_mapping: {}
            to_create: {}
            retry_validate: {}
            retry_map: {}
            retry_create: {}
            reset_budget: {}
            finish: {}
  - step_id: init_scope_params
    step_kind: set_variable
    display_name: init scope params
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.sql_params.init_scope.tenant:
            source: state.tenant_id
          state.sql_params.init_scope.project:
            source: state.project_id
  - step_id: init_scope
    step_kind: connector
    display_name: init scope
    connector_id: extension.flowsteward.data-connector-mcp-toolbox-postgres
    input_mapping_jsonb:
      connection_ref: state.inputs.db_connection
      sql: state.sql_contracts.init_scope.sql
      params: state.sql_params.init_scope
      param_schema: state.sql_contracts.init_scope.param_schema
    output_mapping_jsonb:
      rows: state.rows.init_scope
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      connector:
        operation_id: execute_write
  - step_id: order_json
    step_kind: template
    display_name: order json
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ order|tojson }}'
        format: text
        inputs:
        - name: order
          type: json
          source: state.inputs.order
          required: true
        result_target: state.order_json
  - step_id: admit_params
    step_kind: set_variable
    display_name: admit params
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.sql_params.admit.tenant:
            source: state.tenant_id
          state.sql_params.admit.project:
            source: state.project_id
          state.sql_params.admit.payload:
            source: state.order_json
          state.sql_params.admit.event:
            source: state.inputs.delivery_id
  - step_id: admit
    step_kind: connector
    display_name: admit
    connector_id: extension.flowsteward.data-connector-mcp-toolbox-postgres
    input_mapping_jsonb:
      connection_ref: state.inputs.db_connection
      sql: state.sql_contracts.admit.sql
      params: state.sql_params.admit
      param_schema: state.sql_contracts.admit.param_schema
    output_mapping_jsonb:
      rows: state.rows.admit
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      connector:
        operation_id: execute_write
  - step_id: already_complete
    step_kind: template
    display_name: already complete
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ ''invalid'' if rows|length != 1 or not rows[0].payload_matches else
          ''done'' if rows[0].status == ''done'' else ''pending'' }}'
        format: text
        inputs:
        - name: rows
          type: json
          source: state.rows.admit
          required: true
        result_target: state.already_complete
  - step_id: admission_invalid
    step_kind: if
    display_name: admission invalid
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          selector: state.already_complete
          operator: equals
          value: invalid
  - step_id: is_complete
    step_kind: if
    display_name: is complete
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          selector: state.already_complete
          operator: equals
          value: done
  - step_id: claim_params
    step_kind: set_variable
    display_name: claim params
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.sql_params.claim.tenant:
            source: state.tenant_id
          state.sql_params.claim.project:
            source: state.project_id
          state.sql_params.claim.event:
            source: state.inputs.delivery_id
  - step_id: claim
    step_kind: connector
    display_name: claim
    connector_id: extension.flowsteward.data-connector-mcp-toolbox-postgres
    input_mapping_jsonb:
      connection_ref: state.inputs.db_connection
      sql: state.sql_contracts.claim.sql
      params: state.sql_params.claim
      param_schema: state.sql_contracts.claim.param_schema
    output_mapping_jsonb:
      rows: state.rows.claim
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      connector:
        operation_id: execute_write
  - step_id: has_claim
    step_kind: template
    display_name: has claim
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ ''yes'' if rows|length == 1 else ''no'' }}'
        format: text
        inputs:
        - name: rows
          type: json
          source: state.rows.claim
          required: true
        result_target: state.has_claim
  - step_id: claimed
    step_kind: if
    display_name: claimed
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          selector: state.has_claim
          operator: equals
          value: 'yes'
  - step_id: wait_for_head
    step_kind: wait
    display_name: wait for head
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      wait:
        input_mapping:
          duration_ms: state.inputs.poll_wait_ms
  - step_id: restore
    step_kind: set_variable
    display_name: restore
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.journal:
            source: state.rows.claim.0
          state.order:
            source: state.rows.claim.0.payload_json
  - step_id: dispatch
    step_kind: template
    display_name: dispatch
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ ''review'' if j.retry_attempt > (5 if j.stage == ''create'' else
          3) else j.stage }}'
        format: text
        inputs:
        - name: j
          type: json
          source: state.journal
          required: true
        result_target: state.dispatch
  - step_id: is_review
    step_kind: if
    display_name: is review
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          selector: state.dispatch
          operator: equals
          value: review
  - step_id: is_validate
    step_kind: if
    display_name: is validate
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          selector: state.dispatch
          operator: equals
          value: validate
  - step_id: is_route_validate
    step_kind: if
    display_name: is route validate
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          selector: state.dispatch
          operator: equals
          value: route_validate
  - step_id: is_map
    step_kind: if
    display_name: is map
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          selector: state.dispatch
          operator: equals
          value: map
  - step_id: is_route_map
    step_kind: if
    display_name: is route map
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          selector: state.dispatch
          operator: equals
          value: route_map
  - step_id: is_create
    step_kind: if
    display_name: is create
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          selector: state.dispatch
          operator: equals
          value: create
  - step_id: validate_body
    step_kind: template
    display_name: validate body
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ {"order_ref":order.get("order_ref",""),"customer":order.get("customer"),"shipping_address":order.get("shipping_address"),"shipping_method":order.get("shipping_method",""),"lines":order.get("lines")}|tojson
          }}'
        format: text
        inputs:
        - name: order
          type: json
          source: state.order
          required: true
        - name: validation
          type: json
          source: state.journal.validate_response
          required: true
        - name: mapping
          type: json
          source: state.journal.map_response
          required: true
        result_target: state.validate_body
  - step_id: validate
    step_kind: http_request
    display_name: validate
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      http_request:
        url: https://configure-order-service.invalid/orders/validate
        method: POST
        headers:
          Content-Type: application/json
        body_template: '{{ state.validate_body }}'
        response_mode: inline
        response_target: state.response.validate
        timeout_seconds: 30
        expected_statuses:
