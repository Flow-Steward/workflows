  - step_id: validate_json
    step_kind: template
    display_name: validate json
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ result|tojson }}'
        format: text
        inputs:
        - name: result
          type: json
          source: state.response.validate
          required: true
        result_target: state.validate_json
  - step_id: store_validation_params
    step_kind: set_variable
    display_name: store validation params
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.sql_params.store_validation.tenant:
            source: state.tenant_id
          state.sql_params.store_validation.project:
            source: state.project_id
          state.sql_params.store_validation.body:
            source: state.validate_json
          state.sql_params.store_validation.event:
            source: state.inputs.delivery_id
  - step_id: store_validation
    step_kind: connector
    display_name: store validation
    connector_id: extension.flowsteward.data-connector-mcp-toolbox-postgres
    input_mapping_jsonb:
      connection_ref: state.inputs.db_connection
      sql: state.sql_contracts.store_validation.sql
      params: state.sql_params.store_validation
      param_schema: state.sql_contracts.store_validation.param_schema
    output_mapping_jsonb:
      rows: state.rows.store_validation
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      connector:
        operation_id: execute_write
  - step_id: validation_invalid
    step_kind: if
    display_name: validation invalid
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          selector: state.journal.validate_response.decision
          operator: equals
          value: INVALID
  - step_id: validation_valid
    step_kind: if
    display_name: validation valid
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          selector: state.journal.validate_response.decision
          operator: equals
          value: VALID
  - step_id: invalid_alert_body
    step_kind: template
    display_name: invalid alert body
    error_policy:
      on_error: route_to_step
    optional: false
