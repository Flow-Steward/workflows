    input_mapping_jsonb:
      connection_ref: state.inputs.db_connection
      sql: state.sql_contracts.reset_budget.sql
      params: state.sql_params.reset_budget
      param_schema: state.sql_contracts.reset_budget.param_schema
    output_mapping_jsonb:
      rows: state.rows.reset_budget
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      connector:
        operation_id: execute_write
  - step_id: finish_params
    step_kind: set_variable
    display_name: finish params
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.sql_params.finish.tenant:
            source: state.tenant_id
          state.sql_params.finish.project:
            source: state.project_id
          state.sql_params.finish.event:
            source: state.inputs.delivery_id
  - step_id: finish
    step_kind: connector
    display_name: finish
    connector_id: extension.flowsteward.data-connector-mcp-toolbox-postgres
    input_mapping_jsonb:
      connection_ref: state.inputs.db_connection
      sql: state.sql_contracts.finish.sql
      params: state.sql_params.finish
      param_schema: state.sql_contracts.finish.param_schema
    output_mapping_jsonb:
      rows: state.rows.finish
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      connector:
        operation_id: execute_write
  - step_id: return_to_dispatch
    step_kind: if
    display_name: return to dispatch
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          selector: state.inputs.setup_confirmed
          operator: equals
          value: true
  - step_id: completed
    step_kind: stop_success
    display_name: completed
    optional: false
    override:
      stop_success:
        message: This order reached a source terminal route; journal released the
          next order.
  - step_id: failed
    step_kind: stop_fail
    display_name: failed
    optional: false
    override:
      stop_fail:
        message: Order remains held if admitted. Reconcile journal and uncertain effects
          before recovery; later orders must not overtake.
