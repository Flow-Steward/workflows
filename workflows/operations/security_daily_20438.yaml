      outcome:
        name: 'true'
      target:
        kind: step
        id: done
      rework: false
    - source:
        kind: step
        id: empty_guard
      outcome:
        name: 'false'
      target:
        kind: step
        id: digest_subject
      rework: false
    - source:
        kind: step
        id: digest_subject
      outcome:
        name: success
      target:
        kind: step
        id: digest_mail
      rework: false
    - source:
        kind: step
        id: digest_mail
      outcome:
        name: success
