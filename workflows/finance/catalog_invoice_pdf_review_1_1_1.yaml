schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  exported_at: '2026-11-22T11:31:09+00:00'
  exported_by: admin
  source_workflow_id: catalog_invoice_pdf_review
  portability_kind: workflow_bundle
  flow_steward_version: 0.9.23
  triggers: []
  child_workflow_ids:
  - check_vat_in_vies
workflows:
- workflow_id: catalog_invoice_pdf_review
  version: 1.1.1
  display_name: Review Invoice PDFs and Validate EU VAT with VIES
  description: 'Extract supplier invoice data from a PDF, check line totals and validate
    the seller''s EU VAT number with VIES.


    Use this workflow for accounts payable invoice review, supplier onboarding and
    logistics invoice processing. Upload one invoice PDF. Docling extracts its text,
    and the project''s AI model reads the invoice number, parties, dates, currency,
    seller VAT ID, line items and printed amounts. Fixed rules compare quantity times
    unit price, line amounts against the subtotal, and subtotal plus tax against the
    total. The report flags missing fields and shows how much text was analysed, up
    to 20,000 characters.


    The included Check VAT in VIES workflow verifies the seller''s VAT registration.
    The report and structured outputs distinguish valid, invalid, missing or unsupported
    input, and unavailable. A timeout, a registry error or a failed check opens a
    manual review with the invoice details. Confirming the review completes the report
    with the original VAT status and the reviewer decision. Rejecting the review stops
    the run. VAT verification is a registration check. Invoice posting, payments and
    accounting approval remain with your accounts payable process.


    Requires a configured Docling connection and an AI model in the importing project.
    Enable OCR in Docling for scanned invoices and allow HTTPS access to the European
    Commission VIES service. VIES uses a public API and needs no API key. After import,
    map the Docling connection and enable the included VAT workflow before enabling
    the invoice workflow.'
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      input_schema: {}
      strict_inputs: true
      expected_inputs:
      - name: document
        type: file
        description: Upload one invoice PDF.
        required: true
      expected_outputs:
      - name: report
        type: paragraph
        description: Invoice review report.
        required: true
      - name: invoice_number
        type: string
        description: Invoice number.
        required: false
      - name: seller
        type: string
        description: Seller.
        required: false
      - name: buyer
        type: string
        description: Buyer.
        required: false
      - name: issue_date
        type: string
        description: Issue date as printed.
        required: false
      - name: due_date
        type: string
        description: Due date as printed.
        required: false
      - name: currency
        type: string
        description: Currency.
        required: false
      - name: line_items
        type: array
        description: Line items.
        required: false
      - name: subtotal
        type: number
        description: Printed subtotal.
        required: false
      - name: tax
        type: number
        description: Printed tax.
        required: false
      - name: total
        type: number
        description: Printed total.
        required: false
      - name: missing_fields
        type: array
        description: Fields not printed.
        required: false
      - name: arithmetic_status
        type: string
        description: '''ok'' or the differences found.'
        required: false
      - name: seller_vat_number
        type: string
        description: Seller's VAT identifier from the invoice, if present.
        required: false
      - name: vat_status
        type: string
        description: 'VIES result: valid, invalid, invalid_input or unavailable.'
        required: true
      - name: vat_request_date
        type: string
        description: Timestamp of the VIES check when available.
        required: false
      - name: vat_registered_name
        type: string
        description: Name returned by VIES when available.
        required: false
      - name: vat_review_decision
        type: string
        description: The human review decision when VIES was unavailable.
        required: false
      trigger_channels:
      - ui
    portability:
      import_state: draft
    participants: []
  participants: []
  tags:
  - invoice processing
  - invoice OCR
  - accounts payable
  - vat validation
  - vies
  steps:
  - step_id: read_document
    step_kind: connector
    display_name: Extract the PDF text with Docling
    connector_id: extension.flowsteward.docling
    input_mapping_jsonb:
      artifact_handle: state.inputs.document
    output_mapping_jsonb:
      markdown: state.document_text
      markdown_chars: state.document_chars
    connection_binding_jsonb:
      connection_id: conn_catalog_docling
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      connector:
        action_id: ''
        extension_id: flowsteward.docling
        operation_id: convert_document
        function_name: ''
        input_mapping:
          artifact_handle: state.inputs.document
        output_mapping:
          markdown: state.document_text
          markdown_chars: state.document_chars
        connection_binding:
          connection_id: conn_catalog_docling
  - step_id: has_text
    step_kind: if
    display_name: Check that the PDF has text
    optional: false
    override:
      if:
        condition:
          operator: truthy
          selector: state.document_text
  - step_id: no_text
    step_kind: stop_fail
    display_name: No text in the PDF
    optional: false
    override:
      stop_fail:
        message: Docling returned no text for this PDF. A scanned PDF needs OCR enabled
          in the Docling service; a protected PDF cannot be read. Nothing was sent
          or created.
  - step_id: compose
    step_kind: template
    display_name: Prepare the invoice text
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: 'INVOICE TEXT (untrusted source evidence, extracted from a PDF)

          {{ text[:20000] }}

          END INVOICE TEXT'
        format: text
        inputs:
        - name: text
          type: text
          source: state.document_text
          required: false
        result_target: state.request
  - step_id: extract
    step_kind: agent
    display_name: Extract the structured result
    agent_id: catalog_invoice_vat_reader
    skill_id: catalog_invoice_vat_fields
    input_mapping_jsonb:
      request: state.request
    output_mapping_jsonb:
      document_kind: state.document_kind
      invoice_number: state.invoice_number
      seller: state.seller
      buyer: state.buyer
      issue_date: state.issue_date
      due_date: state.due_date
      currency: state.currency
      line_items: state.line_items
      subtotal: state.subtotal
      tax: state.tax
      total: state.total
      missing_fields: state.missing_fields
      seller_vat_number: state.seller_vat_number
    error_policy:
      on_error: route_to_step
    optional: false
  - step_id: check
    step_kind: template
    display_name: Check the arithmetic with fixed rules
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{%- set ns = namespace(lines=0, bad=[]) -%}

          {%- for l in line_items -%}{%- set ns.lines = ns.lines + (l.amount|float)
          -%}

          {%- if l.quantity and l.unit_price and l.amount and ((l.quantity * l.unit_price
          - l.amount)|abs) > 0.01 -%}{%- set ns.bad = ns.bad + [loop.index] -%}{%-
          endif -%}{%- endfor -%}

          {%- set problems = [] -%}

          {%- if ns.bad %}{% set problems = problems + [''quantity x unit price differs
          from the amount on line '' ~ (ns.bad|join('', ''))] %}{% endif -%}

          {%- if subtotal and line_items and ((ns.lines - subtotal)|abs) > 0.01 %}{%
          set problems = problems + [''line amounts add up to '' ~ (''%.2f''|format(ns.lines))
          ~ '', printed subtotal is '' ~ (''%.2f''|format(subtotal))] %}{% endif -%}

          {%- if total and ((subtotal + tax - total)|abs) > 0.01 and subtotal %}{%
          set problems = problems + [''subtotal + tax is '' ~ (''%.2f''|format(subtotal
          + tax)) ~ '', printed total is '' ~ (''%.2f''|format(total))] %}{% endif
          -%}

          {%- if not total %}{% set problems = problems + [''no printed total''] %}{%
          endif -%}

          {{ ''ok'' if not problems else problems|join(''; '') }}'
        format: text
        inputs:
        - name: line_items
          type: array
          source: state.line_items
          required: false
        - name: subtotal
          type: number
          source: state.subtotal
          required: false
        - name: tax
          type: number
          source: state.tax
          required: false
        - name: total
          type: number
          source: state.total
          required: false
        result_target: state.arithmetic_status
  - step_id: report
    step_kind: template
    display_name: Build the review report
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '# {{ (document_kind or ''document'')|capitalize }} {{ invoice_number
          or ''(no number)'' }}


          | Field | Value |

          |---|---|

          | Seller | {{ seller or ''—'' }} |

          | Buyer | {{ buyer or ''—'' }} |

          | Issue date | {{ issue_date or ''—'' }} |

          | Due date | {{ due_date or ''—'' }} |

          | Currency | {{ currency or ''—'' }} |

          | Subtotal | {{ ''%.2f''|format(subtotal) if subtotal else ''—'' }} |

          | Tax | {{ ''%.2f''|format(tax) if tax else ''—'' }} |

          | Total | {{ ''%.2f''|format(total) if total else ''—'' }} |


          ## Line items

          {% if line_items %}| # | Description | Qty | Unit price | Amount |

          |---|---|---|---|---|

          {% for l in (line_items or []) %}| {{ loop.index }} | {{ l.description }}
          | {{ l.quantity or ''—'' }} | {{ l.unit_price or ''—'' }} | {{ l.amount
          or ''—'' }} |

          {% endfor %}{% else %}No line items were read.

          {% endif %}

          ## Checks

          {% if arithmetic == ''ok'' %}✅ Line amounts, subtotal, tax and total are
          consistent.{% else %}⚠ Needs review: {{ arithmetic }}.{% endif %}

          {% if missing_fields %}⚠ Not printed: {{ (missing_fields or [])|join('',
          '') }}.{% endif %}


          ---

          Source: the uploaded PDF, {{ chars|default(text|length, true)|int }} characters
          of text from Docling; the first {{ [text|length, 20000]|min }} were analysed.{%
          if text|length > 20000 or (chars and chars > text|length) %} **Partial review:**
          the rest of the document was not read.{% endif %}

          This report records the invoice checks. Payment and posting are separate
          steps in accounts payable.


          ## Seller VAT validation (VIES)


          - VAT ID on the invoice: {{ seller_vat_number | default(''—'', true) }}

          - VIES result: {{ vat_status }}

          {% if vat_request_date | default(false) %}- Checked at: {{ vat_request_date
          }}

          {% endif %}{% if vat_registered_name | default(false) %}- Registered name:
          {{ vat_registered_name }}

          {% endif %}{% if vat_status == ''unavailable'' %}VIES could not complete
          the check.

          {% elif vat_status == ''invalid'' %}VIES reported that the seller''s VAT
          number is invalid.

          {% elif vat_status == ''invalid_input'' %}Provide an unambiguous seller
          VAT number with a supported VIES prefix to check it.

          {% endif %}'
        format: markdown
        inputs:
        - name: document_kind
          type: text
          source: state.document_kind
          required: false
        - name: invoice_number
          type: text
          source: state.invoice_number
          required: false
        - name: seller
          type: text
          source: state.seller
          required: false
        - name: buyer
          type: text
          source: state.buyer
          required: false
        - name: issue_date
          type: text
          source: state.issue_date
          required: false
        - name: due_date
          type: text
          source: state.due_date
          required: false
        - name: currency
          type: text
          source: state.currency
          required: false
        - name: line_items
          type: array
          source: state.line_items
          required: false
        - name: subtotal
          type: number
          source: state.subtotal
          required: false
        - name: tax
          type: number
          source: state.tax
          required: false
        - name: total
          type: number
          source: state.total
          required: false
        - name: missing_fields
          type: array
          source: state.missing_fields
          required: false
        - name: arithmetic
          type: text
          source: state.arithmetic_status
          required: false
        - name: text
          type: text
          source: state.document_text
          required: false
        - name: chars
          type: number
          source: state.document_chars
          required: false
        - name: seller_vat_number
          type: json
          source: state.seller_vat_number
          required: false
        - name: vat_status
          type: json
          source: state.vat_status
          required: false
        - name: vat_request_date
          type: json
          source: state.vat_request_date
          required: false
        - name: vat_registered_name
          type: json
          source: state.vat_registered_name
          required: false
        result_target: state.report
  - step_id: done
    step_kind: stop_success
    display_name: Result ready
    optional: false
    override:
      stop_success:
        message: Invoice review report ready.
  - step_id: failed
    step_kind: stop_fail
    display_name: Analysis could not be completed
    optional: false
    override:
      stop_fail:
        message: The model could not complete the analysis. Open the failed step in
          Job Details for the provider message, then retry. Nothing was sent or created.
  - step_id: docling_failed
    step_kind: stop_fail
    display_name: Docling could not read the PDF
    optional: false
    override:
      stop_fail:
        message: Docling could not convert the PDF. Check the project's Docling connection
          (service address and API key) and retry; the Docling step in Job Details
          shows the HTTP status. No model analysis ran and nothing was sent or created.
  - step_id: check_vat
    step_kind: invoke_workflow
    display_name: Check the seller's VAT number in VIES
    workflow_id: check_vat_in_vies
    error_policy:
      on_error: route_to_step
    override:
      invoke_workflow:
        workflow_id: check_vat_in_vies
        input_mapping:
          vat_number: state.seller_vat_number
        output_mapping:
          status: state.vat_status
          request_date: state.vat_request_date
          name: state.vat_registered_name
  - step_id: vat_check_failed
    step_kind: set_variable
    display_name: Record the unavailable VAT check
    override:
      set_variable:
        target: state.vat_status
        value: unavailable
  - step_id: requires_vat_review
    step_kind: if
    display_name: Check whether VAT verification needs a reviewer
    override:
      if:
        condition:
          selector: state.vat_status
          operator: equals
          value: unavailable
  - step_id: review_vat
    step_kind: approval
    display_name: Manually review the seller's VAT
    override:
      approval:
        message: VIES could not complete the seller's VAT check. Review the invoice
          and record your decision. Approve to finish the report or Reject to stop.
          The recorded VIES status stays unavailable.
        show_outputs:
        - state.report
        output_mapping:
          decision: state.vat_review_decision
  - step_id: finalize_vat_report
    step_kind: template
    display_name: Record the manual VAT review in the final report
    override:
      template:
        format: markdown
        inputs:
        - name: report
          type: text
          source: state.report
          required: true
        - name: decision
          type: text
          source: state.vat_review_decision
          required: true
        text: '{{ report | trim }}


          Manual VAT review: {{ decision }}.

          '
        result_target: state.report
  - step_id: vat_review_rejected
    step_kind: stop_fail
    display_name: Stop after VAT review rejection
    override:
      stop_fail:
        message: The reviewer stopped the run after the unavailable VAT check.
  groups: []
  for_each: []
  execution_graph:
    edges:
    - rework: false
      source:
        id: read_document
        kind: step
      target:
        id: has_text
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: read_document
        kind: step
      target:
        id: docling_failed
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: has_text
        kind: step
      target:
        id: compose
        kind: step
      outcome:
        name: 'true'
    - rework: false
      source:
        id: has_text
        kind: step
      target:
        id: no_text
        kind: step
      outcome:
        name: 'false'
    - rework: false
      source:
        id: compose
        kind: step
      target:
        id: extract
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: extract
        kind: step
      target:
        id: check
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: check
        kind: step
      target:
        id: check_vat
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: report
        kind: step
      target:
        id: requires_vat_review
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: compose
        kind: step
      target:
        id: failed
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: extract
        kind: step
      target:
        id: failed
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: check
        kind: step
      target:
        id: failed
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: report
        kind: step
      target:
        id: failed
        kind: step
      outcome:
        name: error
    - source:
        kind: step
        id: check_vat
      outcome:
        name: success
      target:
        kind: step
        id: report
      rework: false
    - source:
        kind: step
        id: check_vat
      outcome:
        name: error
      target:
        kind: step
        id: vat_check_failed
      rework: false
    - source:
        kind: step
        id: vat_check_failed
      outcome:
        name: success
      target:
        kind: step
        id: report
      rework: false
    - source:
        kind: step
        id: requires_vat_review
      outcome:
        name: 'true'
      target:
        kind: step
        id: review_vat
      rework: false
    - source:
        kind: step
        id: requires_vat_review
      outcome:
        name: 'false'
      target:
        kind: step
        id: done
      rework: false
    - source:
        kind: step
        id: review_vat
      outcome:
        name: approved
      target:
        kind: step
        id: finalize_vat_report
      rework: false
    - source:
        kind: step
        id: finalize_vat_report
      outcome:
        name: success
      target:
        kind: step
        id: done
      rework: false
    - source:
        kind: step
        id: review_vat
      outcome:
        name: rejected
      target:
        kind: step
        id: vat_review_rejected
      rework: false
    entry:
      id: read_document
      kind: step
    schema_version: 1
- workflow_id: check_vat_in_vies
  version: 1.0.0
  display_name: Check VAT in VIES
  description: Check one counterparty VAT number against EU VIES and return a verdict
    to the calling workflow. A provider error yields unavailable.
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      strict_inputs: true
      trigger_channels:
      - ui
      - parent_workflow
      expected_inputs:
      - name: vat_number
        label: VAT number
        type: string
        required: false
        description: Counterparty VAT number with its VIES country prefix, for example
          PL followed by the number. Missing input returns invalid_input.
      expected_outputs:
      - name: status
        type: string
        required: true
        description: valid, invalid, invalid_input or unavailable.
      - name: request_date
        type: string
        required: false
        description: Timestamp from VIES when it returned a verdict.
      - name: name
        type: string
        required: false
        description: Counterparty name when VIES returned it.
    portability:
      import_state: draft
  participants: []
  tags:
  - finance
  - logistics
  - vies
  steps:
  - step_id: normalize_vat
    step_kind: template
    display_name: Normalize VAT number
    override:
      template:
        format: text
        inputs:
        - name: vat_number
          type: json
          source: state.inputs.vat_number
          required: false
        result_target: state.normalized_vat
        text: "{%- set vat = vat_number.split() | join | upper if vat_number is string\
          \ else '' -%} {%- set prefixes = 'AT BE BG HR CY CZ DE DK EE EL ES FI FR\
          \ HU IE IT LT LU LV MT NL PL PT RO SE SI SK XI'.split() -%} {%- if vat |\
          \ length > 2 and vat[:2] in prefixes and not (vat[2:] | reject('in', '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ')\
          \ | list) -%}\n  {{ vat }}\n{%- endif -%}"
  - step_id: require_vat
    step_kind: if
    display_name: Require a VAT number with a supported prefix
    override:
      if:
        condition:
          selector: state.normalized_vat
          operator: truthy
  - step_id: build_request
    step_kind: template
    display_name: Build VIES request
    override:
      template:
        format: text
        inputs:
        - name: vat
          type: text
          source: state.normalized_vat
          required: true
        result_target: state.vies_request
        text: '{{ {''countryCode'': vat[:2], ''vatNumber'': vat[2:]} | tojson }}'
  - step_id: call_vies
    step_kind: http_request
    display_name: Check VAT with VIES
    error_policy:
      on_error: route_to_step
    override:
      http_request:
        method: POST
        url: https://ec.europa.eu/taxation_customs/vies/rest-api/check-vat-number
        headers:
          Accept: application/json
          Content-Type: application/json
        auth_mode: none
        body_template:
          source: state.vies_request
        response_mode: inline
        response_target: state.vies_response
        timeout_seconds: 15
        expected_statuses:
        - 200
        max_response_bytes: 32768
  - step_id: classify_response
    step_kind: template
    display_name: Read the VIES verdict
    override:
      template:
        format: text
        inputs:
        - name: vat
          type: text
          source: state.normalized_vat
          required: true
        - name: response
          type: json
          source: state.vies_response
          required: false
        result_target: state.outputs.status
        text: "{%- if response is not mapping\n    or response.get('actionSucceed',\
          \ true) is not sameas true\n    or response.get('errorWrappers')\n    or\
          \ response.get('userError')\n    or response.get('countryCode') != vat[:2]\n\
          \    or response.get('vatNumber') != vat[2:] -%}\n  unavailable\n{%- elif\
          \ response.get('valid') is sameas true -%}\n  valid\n{%- elif response.get('valid')\
          \ is sameas false -%}\n  invalid\n{%- else -%}\n  unavailable\n{%- endif\
          \ -%}"
  - step_id: have_verdict
    step_kind: if
    display_name: Include details only for a completed VAT check
    override:
      if:
        condition:
          selector: state.outputs.status
          operator: not_equals
          value: unavailable
  - step_id: record_date
    step_kind: set_variable
    display_name: Return the VIES check timestamp
    override:
      set_variable:
        target: state.outputs.request_date
        value:
          source: state.vies_response.requestDate
  - step_id: record_name
    step_kind: template
    display_name: Return the counterparty name when available
    override:
      template:
        format: text
        inputs:
        - name: name
          type: json
          source: state.vies_response.name
          required: false
        result_target: state.outputs.name
        text: '{{ name | trim if name is string and name | trim != ''---'' else ''''
          }}'
  - step_id: invalid_input
    step_kind: set_variable
    display_name: Return invalid input
    override:
      set_variable:
        target: state.outputs.status
        value: invalid_input
  - step_id: unavailable
    step_kind: set_variable
    display_name: Return VIES unavailable
    override:
      set_variable:
        target: state.outputs.status
        value: unavailable
  - step_id: done
    step_kind: stop_success
    display_name: Return the VAT check result
  groups: []
  for_each: []
  execution_graph:
    schema_version: 1
    entry:
      kind: step
      id: normalize_vat
    edges:
    - source:
        kind: step
        id: normalize_vat
      outcome:
        name: success
