      to: state.recipient
      subject: state.subject
      body_text: state.body
    output_mapping_jsonb:
      delivered: state.delivered
    error_policy:
      on_error: route_to_step
    override:
      connector:
        operation_id: send_email
        extension_id: flowsteward.outgoing-email
  - step_id: accepted
    step_kind: if
    for_each_id: invoices
    override:
      if:
        condition: state.delivered == true
  - step_id: log_stage
