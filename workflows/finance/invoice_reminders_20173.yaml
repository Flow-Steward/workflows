- workflow_id: invoice_stage_write_20173
  version: 0.1.0
  display_name: Record accepted invoice stage while preserving complete table
  description: 'Persist a sent invoice reminder stage while preserving other invoice
    rows. Adapted from https://n8n.io/workflows/20173/. Offline executor qualification:
    34 source scenarios passed with synthetic provider/model replies; no live API
    or import verification. Disabled on import. Configure released Google Workspace
    0.3.3 and Outgoing Email/SMTP 0.3.1 connections. Complete reads are limited to
    100 rows per table; use dedicated contiguous plain-value tables and one writer.
    SMTP replaces Gmail sending. Source forms/schedules and trusted current-time inputs
    require separate setup; only callable workflow structure is included. Select the
    model, validate setup and enable any included agents, skills and child workflows
    before enabling the main workflow.'
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: json_schema
      strict_inputs: true
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
      input_schema:
        type: object
        properties:
          google_connection_ref:
            type: string
            minLength: 1
          spreadsheet_id:
            type: string
            minLength: 1
          invoice_id:
            type: string
            minLength: 1
          stage_day:
            type: string
            minLength: 1
          today:
            type: string
            minLength: 1
          setup_confirmed:
            type: boolean
        required:
        - google_connection_ref
        - spreadsheet_id
        - invoice_id
        - stage_day
        - today
        - setup_confirmed
        additionalProperties: false
  participants: []
  tags:
  - migration
  - n8n
  - disabled
  - business-equivalent
  steps:
  - step_id: init
    step_kind: set_variable
    override:
      set_variable:
        assignments:
          state.headers:
          - invoice_id
          - customer_name
          - customer_email
          - amount
          - currency
          - due_date
          - status
          - payment_link
          - notes
          - last_stage_sent
          - last_sent_at
          state.matrix: []
  - step_id: reread
    step_kind: connector
    connector_id: extension.flowsteward.google-workspace
    input_mapping_jsonb:
      connection_ref: state.inputs.google_connection_ref
      spreadsheet_id: state.inputs.spreadsheet_id
      sheet_title: literal:Invoices
      header_mode: literal:first_row
    output_mapping_jsonb:
      result: state.sheet
    error_policy:
      on_error: route_to_step
    override:
      connector:
        operation_id: read_google_sheet
        extension_id: flowsteward.google-workspace
