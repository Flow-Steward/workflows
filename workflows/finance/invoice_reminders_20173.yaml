schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  exported_at: '2026-11-03T19:27:57+00:00'
  exported_by: admin
  source_workflow_id: invoice_reminders_20173
  portability_kind: workflow_bundle
  flow_steward_version: 0.9.9
  triggers: []
  child_workflow_ids:
  - invoice_stage_write_20173
workflows:
- workflow_id: invoice_reminders_20173
  version: 0.1.0
  display_name: Invoice reminders, escalation and weekly aging
  description: 'Remind customers about overdue invoices, escalate and produce an aging
    report. Adapted from https://n8n.io/workflows/20173/. Offline executor qualification:
    34 source scenarios passed with synthetic provider/model replies; no live API
    or import verification. Disabled on import. Configure released Google Workspace
    0.3.3 and Outgoing Email/SMTP 0.3.1 connections. Complete reads are limited to
    100 rows per table; use dedicated contiguous plain-value tables and one writer.
    SMTP replaces Gmail sending. Source forms/schedules and trusted current-time inputs
    require separate setup; only callable workflow structure is included. Select the
    model, validate setup and enable any included agents, skills and child workflows
    before enabling the main workflow.'
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: json_schema
      strict_inputs: true
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
      input_schema:
        type: object
        properties:
          today:
            type: string
            minLength: 1
          google_connection_ref:
            type: string
            minLength: 1
          smtp_connection_ref:
            type: string
            minLength: 1
          spreadsheet_id:
            type: string
            minLength: 1
          company_name:
            type: string
            minLength: 1
          sender_name:
            type: string
            minLength: 1
          finance_email:
            type: string
            minLength: 1
          escalation_email:
            type: string
            minLength: 1
          setup_confirmed:
            type: boolean
          reminder_days:
            type: array
            minItems: 1
            items:
              type: integer
              minimum: 0
          escalation_day:
            type: integer
            minimum: 1
          closed_statuses:
            type: array
            items:
              type: string
          aging_report_weekday:
            type: integer
            minimum: 0
            maximum: 6
          test_mode:
            type: boolean
        required:
        - today
        - google_connection_ref
        - smtp_connection_ref
        - spreadsheet_id
        - company_name
        - sender_name
        - finance_email
        - escalation_email
        - setup_confirmed
        - reminder_days
        - escalation_day
        - closed_statuses
        - aging_report_weekday
        - test_mode
        additionalProperties: false
  participants: []
  tags:
  - migration
  - n8n
  - disabled
  - business-equivalent
  steps:
  - step_id: headers
    step_kind: set_variable
    override:
      set_variable:
        assignments:
          state.headers:
          - invoice_id
          - customer_name
          - customer_email
          - amount
          - currency
          - due_date
          - status
          - payment_link
          - notes
          - last_stage_sent
          - last_sent_at
  - step_id: setup_guard
    step_kind: if
    override:
      if:
        condition: state.inputs.setup_confirmed == true
  - step_id: read_invoices
    step_kind: connector
    connector_id: extension.flowsteward.google-workspace
    input_mapping_jsonb:
      connection_ref: state.inputs.google_connection_ref
      spreadsheet_id: state.inputs.spreadsheet_id
      sheet_title: literal:Invoices
      header_mode: literal:first_row
    output_mapping_jsonb:
      result: state.sheet
    error_policy:
      on_error: route_to_step
    override:
      connector:
        operation_id: read_google_sheet
        extension_id: flowsteward.google-workspace
  - step_id: validate_table
    step_kind: template
    override:
      template:
        text: '{%- macro ordinal(v) -%}

          {%- if v is number and v is not boolean and v == v|int and v >= 2 and v
          <= 73050 -%}{{ v|int + 693594 }}

          {%- elif v is string and v.isdigit() and v|int >= 2 and v|int <= 73050 -%}{{
          v|int + 693594 }}

          {%- elif v is string and v|length == 10 and v[4] == ''-'' and v[7] == ''-''
          and v[0:4].isdigit() and v[5:7].isdigit() and v[8:10].isdigit() -%}

          {%- set y=v[0:4]|int -%}{%- set m=v[5:7]|int -%}{%- set d=v[8:10]|int -%}

          {%- set leap=(y%4==0 and (y%100!=0 or y%400==0)) -%}

          {%- set lengths=[31,29 if leap else 28,31,30,31,30,31,31,30,31,30,31] -%}

          {%- if y>=1900 and y<=2099 and m>=1 and m<=12 and d>=1 and d<=lengths[m-1]
          -%}

          {{ 365*(y-1)+(y-1)//4-(y-1)//100+(y-1)//400+[0,31,59,90,120,151,181,212,243,273,304,334][m-1]+(1
          if leap and m>2 else 0)+d }}

          {%- else -%}invalid{%- endif -%}

          {%- else -%}invalid{%- endif -%}{%- endmacro -%}

          {%- macro iso(v) -%}

          {%- if v is string and v|length==10 and v[4]==''-'' -%}{{v}}

          {%- else -%}

          {%- set z=v|int-25569+719468 -%}{%- set era=z//146097 -%}{%- set doe=z-era*146097
          -%}

          {%- set yoe=(doe-doe//1460+doe//36524-doe//146096)//365 -%}{%- set y=yoe+era*400
          -%}

          {%- set doy=doe-(365*yoe+yoe//4-yoe//100) -%}{%- set mp=(5*doy+2)//153 -%}

          {%- set d=doy-(153*mp+2)//5+1 -%}{%- set m=mp+(3 if mp<10 else -9) -%}

          {{ ''%04d-%02d-%02d''|format(y+(1 if m<=2 else 0),m,d) }}

          {%- endif -%}{%- endmacro -%}

          {%- macro cents(v) -%}

          {%- set s=v|string|trim|replace('','',''.'') -%}{%- set neg=s.startswith(''-'')
          -%}

          {%- set a=s[1:] if neg else s -%}{%- set p=a.split(''.'') -%}

          {%- if p|length<=2 and p[0].isdigit() and (p|length==1 or (p[1].isdigit()
          and p[1]|length<=2)) and p[0]|length<=12 -%}

          {{ (-1 if neg else 1)*(p[0]|int*100+((p[1]~''00'')[0:2]|int if p|length==2
          else 0)) }}

          {%- else -%}invalid{%- endif -%}{%- endmacro -%}

          {%- macro money(c) -%}{{ ''-'' if c<0 else '''' }}{{ (c|abs)//100 }}.{{
          ''%02d''|format((c|abs)%100) }}{%- endmacro -%}

          {%- set n=namespace(ok=true,ids=[]) -%}

          {%- if not p.setup_confirmed or ordinal(p.today)==''invalid'' or p.today
          is not string or not p.google_connection_ref or not p.smtp_connection_ref
          or not p.spreadsheet_id or not p.finance_email or ''@'' not in p.finance_email
          or ''@'' not in p.escalation_email -%}{%- set n.ok=false -%}{%- endif -%}

          {%- if s.row_count>100 or s.preview|length!=s.row_count or s.column_count!=11
          or s.schema|map(attribute=''name'')|list!=headers -%}{%- set n.ok=false
          -%}{%- endif -%}

          {%- if p.reminder_days|length==0 or p.reminder_days|unique|list|length!=p.reminder_days|length
          or p.escalation_day<1 or p.aging_report_weekday<0 or p.aging_report_weekday>6
          -%}{%- set n.ok=false -%}{%- endif -%}

          {%- for day in p.reminder_days -%}{%- if day is not integer or day<0 or
          day>=p.escalation_day -%}{%- set n.ok=false -%}{%- endif -%}{%- endfor -%}

          {%- for r in s.preview -%}

          {%- if r.invoice_id is not string or not r.invoice_id or r.invoice_id in
          n.ids or ordinal(r.due_date)==''invalid'' or cents(r.amount)==''invalid''
          or not r.customer_email or ''@'' not in r.customer_email or r.currency is
          not string or r.currency|length!=3 -%}{%- set n.ok=false -%}{%- endif -%}

          {%- set n.ids=n.ids+[r.invoice_id] -%}

          {%- set last=(r.last_stage_sent if r.last_stage_sent is not none else '''')|string
          -%}

          {%- if last and (not last.isdigit()) -%}{%- set n.ok=false -%}{%- endif
          -%}

          {%- endfor -%}{{ ''ok'' if n.ok else ''invalid'' }}'
        format: text
        inputs:
        - name: p
          type: object
          required: true
          source: state.inputs
        - name: s
          type: object
          required: true
          source: state.sheet
        - name: headers
          type: array
          required: true
          source: state.headers
        result_target: state.validate_table
  - step_id: valid_table
    step_kind: if
    override:
      if:
        condition: state.validate_table == 'ok'
  - step_id: stage
