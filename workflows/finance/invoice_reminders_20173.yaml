      outcome:
        name: 'false'
      target:
        kind: step
        id: failed
    - source:
        kind: step
        id: row_copy
      outcome:
        name: success
      target:
        kind: step
        id: target_row
    - source:
        kind: step
        id: target_row
      outcome:
        name: 'true'
      target:
        kind: step
        id: patch_stage
    - source:
        kind: step
        id: target_row
      outcome:
        name: 'false'
      target:
        kind: step
        id: wrap_row
    - source:
        kind: step
        id: patch_stage
      outcome:
        name: success
      target:
        kind: step
        id: wrap_row
    - source:
        kind: step
        id: wrap_row
      outcome:
        name: success
      target:
        kind: step
        id: row_values
    - source:
        kind: step
        id: row_values
      outcome:
