          if leap and m>2 else 0)+d }}

          {%- else -%}invalid{%- endif -%}

          {%- else -%}invalid{%- endif -%}{%- endmacro -%}

          {%- macro iso(v) -%}

          {%- if v is string and v|length==10 and v[4]==''-'' -%}{{v}}

          {%- else -%}

          {%- set z=v|int-25569+719468 -%}{%- set era=z//146097 -%}{%- set doe=z-era*146097
          -%}

