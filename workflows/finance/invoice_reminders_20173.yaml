          ''%02d''|format((c|abs)%100) }}{%- endmacro -%}

          {%- set n=namespace(ok=true,matches=0,ids=[]) -%}

          {%- if not p.setup_confirmed or ordinal(p.today)==''invalid'' or not p.stage_day.isdigit()
