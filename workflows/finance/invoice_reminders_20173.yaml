          -%}

          {%- set a=s[1:] if neg else s -%}{%- set p=a.split(''.'') -%}

          {%- if p|length<=2 and p[0].isdigit() and (p|length==1 or (p[1].isdigit()
          and p[1]|length<=2)) and p[0]|length<=12 -%}

          {{ (-1 if neg else 1)*(p[0]|int*100+((p[1]~''00'')[0:2]|int if p|length==2
          else 0)) }}

          {%- else -%}invalid{%- endif -%}{%- endmacro -%}

          {%- macro money(c) -%}{{ ''-'' if c<0 else '''' }}{{ (c|abs)//100 }}.{{
          ''%02d''|format((c|abs)%100) }}{%- endmacro -%}

          {%- set days=ordinal(p.today)|int-ordinal(r.due_date)|int -%}

          {%- set last=(r.last_stage_sent if r.last_stage_sent is not none else '''')
          -%}

          {%- set previous=last|int if last|string|length else -999999 -%}

          {%- set n=namespace(stage=-1) -%}

          {%- if r.status|default('''',true)|trim|lower not in p.closed_statuses -%}

          {%- if days>=p.escalation_day and previous<p.escalation_day -%}{%- set n.stage=p.escalation_day
          -%}

          {%- else -%}{%- for day in p.reminder_days|sort -%}

          {%- if day<=days and day>previous and day<p.escalation_day -%}{%- set n.stage=day
          -%}{%- endif -%}

          {%- endfor -%}{%- endif -%}{%- endif -%}

          {{ n.stage }}'
        format: text
        inputs:
        - name: p
          type: object
          required: true
          source: state.inputs
        - name: r
          type: object
          required: true
          source: state.invoice
        result_target: state.stage
  - step_id: should_send
    step_kind: if
    for_each_id: invoices
    override:
      if:
        condition: state.stage != '-1'
  - step_id: recipient
    step_kind: template
    for_each_id: invoices
    override:
      template:
        text: '{{ p.escalation_email if stage|int==p.escalation_day else (p.finance_email
          if p.test_mode else r.customer_email) }}'
        format: text
        inputs:
        - name: p
          type: object
          required: true
          source: state.inputs
        - name: r
          type: object
          required: true
          source: state.invoice
        - name: stage
          type: text
          required: true
          source: state.stage
        result_target: state.recipient
