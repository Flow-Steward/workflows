          {%- elif v is string and v.isdigit() and v|int >= 2 and v|int <= 73050 -%}{{
          v|int + 693594 }}

          {%- elif v is string and v|length == 10 and v[4] == ''-'' and v[7] == ''-''
          and v[0:4].isdigit() and v[5:7].isdigit() and v[8:10].isdigit() -%}

          {%- set y=v[0:4]|int -%}{%- set m=v[5:7]|int -%}{%- set d=v[8:10]|int -%}

