          default: ''
        - from: payment_link
          to: payment_link
          type: json
          default: ''
        - from: notes
          to: notes
          type: json
          default: ''
        - from: last_stage_sent
          to: last_stage_sent
          type: json
          default: ''
        - from: last_sent_at
          to: last_sent_at
          type: json
          default: ''
        result_target: state.cells
  - step_id: target_row
    step_kind: if
    for_each_id: rows
    override:
      if:
        condition: state.record.invoice_id == state.inputs.invoice_id
  - step_id: patch_stage
    step_kind: set_variable
    for_each_id: rows
    override:
      set_variable:
        assignments:
          state.cells.last_stage_sent:
            source: state.inputs.stage_day
          state.cells.last_sent_at:
            source: state.inputs.today
  - step_id: wrap_row
    step_kind: set_variable
    for_each_id: rows
    override:
      set_variable:
        assignments:
          state.wrapper: {}
          state.wrapper.row:
            source: state.cells
  - step_id: row_values
    step_kind: transform
    for_each_id: rows
    override:
      transform:
        input:
          source: state.wrapper
        mode: object
        fields:
        - from: row
          to: cells
          type: array
          actions:
          - action: json.values
        result_target: state.projected
  - step_id: collect_row
    step_kind: collect
    for_each_id: rows
    override:
      collect:
        source: state.projected.cells
        target: state.matrix
        mode: append
  - step_id: write_snapshot
    step_kind: connector
    connector_id: extension.flowsteward.google-workspace
    input_mapping_jsonb:
      connection_ref: state.inputs.google_connection_ref
      spreadsheet_id: state.inputs.spreadsheet_id
      sheet_title: literal:Invoices
      mode: literal:overwrite
      start_cell: literal:A2
      inline_rows: state.matrix
    output_mapping_jsonb:
      result: state.written
    error_policy:
      on_error: route_to_step
    override:
      connector:
        operation_id: write_google_sheet
        extension_id: flowsteward.google-workspace
  - step_id: failed
    step_kind: stop_fail
    override:
      stop_fail:
        message: Cannot safely record stage; reconcile sent email and table before
          retry
  - step_id: done
    step_kind: stop_success
    override:
      stop_success:
        message: Accepted stage logged; complete remaining rows preserved
  groups: []
  for_each:
