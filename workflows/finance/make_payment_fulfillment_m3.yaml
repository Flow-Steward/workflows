dependencies:
  agents: []
  skills: []
  tools:
  - tool_id: connector.m3_drive_folder_create_template
    display_name: connector.m3_drive_folder_create_template
    required: true
    sources:
    - create_drive_folder.override
  child_workflows: []
  published_blocks: []
  extensions:
