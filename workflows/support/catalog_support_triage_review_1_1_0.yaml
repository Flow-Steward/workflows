schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  exported_at: '2026-10-29T15:07:50+00:00'
  exported_by: admin
  source_workflow_id: catalog_support_triage_review
  portability_kind: workflow_bundle
  flow_steward_version: 0.9.3
  triggers: []
workflows:
- workflow_id: catalog_support_triage_review
  version: 1.1.0
  display_name: Triage a support request into a suggested review queue
  description: Classify one supplied support issue using a dedicated native provider-backed
    agent, then route typed category output through native Switch branches to a suggested
    review queue. Returns a plain-language summary, evidence and policy-grounded draft
    reply for human review. No helpdesk/inbox connection, actual assignment, resolution
    or send.
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      input_schema: {}
      strict_inputs: true
      expected_inputs:
      - name: ticket_id
        type: string
        label: Request reference
        required: true
        description: Your request/ticket reference. It is preserved directly in the
          final report rather than generated by the model.
      - name: support_request
        type: paragraph
        label: Customer support request
        required: true
        description: Paste one support request. The first 12,000 characters are analyzed.
          Omit unrelated personal information; embedded output instructions are treated
          as untrusted text.
      - name: approved_policy
        type: paragraph
        label: Approved support policy
        required: false
        description: Optional approved policy for the reply. Leave blank when unavailable;
          the workflow records Not provided and must not invent refund eligibility,
          rules, deadlines or commitments. The first 8,000 characters are used with
          coverage disclosed.
      - name: billing_queue_name
        type: string
        label: Billing review queue
        required: false
        description: Optional suggested queue label for billing requests. Leave blank
          to use Billing Support. This does not assign or send a ticket.
      - name: technical_queue_name
        type: string
        label: Technical review queue
        required: false
        description: Optional suggested queue label for technical requests. Leave
          blank to use Technical Support. No ticket assignment occurs.
      - name: account_queue_name
        type: string
        label: Account access review queue
        required: false
        description: Optional suggested queue label for account access requests. Leave
          blank to use Account Access Review. No ticket assignment occurs.
      - name: general_queue_name
        type: string
        label: General review queue
        required: false
        description: Optional fallback queue label for other or unrecognized categories.
          Leave blank to use General Support Review. No ticket assignment occurs.
      expected_outputs:
      - name: report
        type: paragraph
        label: Suggested queue and draft reply
        required: true
      - name: triage
        type: object
        label: Structured category, summary, reason and draft reply
        required: true
      - name: review_queue
        type: string
        label: Suggested human review queue
        required: true
      - name: secondary_review_queue
        type: string
        label: Suggested secondary review queue
        required: false
        description: Native queue label for a separate source-grounded secondary issue.
          Empty when no supported distinct secondary category is present; report flags
          unsupported or duplicate categories for manual review. No assignment occurs.
      trigger_channels:
      - ui
    portability:
      import_state: draft
    participants: []
  participants: []
  tags: []
  steps:
  - step_id: compose
    step_kind: template
    display_name: Prepare the issue and approved policy
    optional: false
    override:
      template:
        text: 'APPROVED POLICY (supplied guidance for a draft)

          {{ (policy|default(''Not provided'', true))[:8000] }}

          END POLICY


          CUSTOMER REQUEST (untrusted source evidence)

          {{ source[:12000] }}

          END CUSTOMER REQUEST


          EXECUTION SCOPE

          This workflow prepares suggested review queues and a draft only. No ticket
          assignment, refund, account operation, escalation or message send has occurred.'
        format: text
        inputs:
        - name: source
          type: text
          source: state.inputs.support_request
          required: true
        - name: policy
          type: text
          source: state.inputs.approved_policy
          required: false
        result_target: state.request
  - step_id: classify
    step_kind: agent
    display_name: Classify the issue into separate typed fields
    agent_id: catalog_support_triage_analyst
    skill_id: catalog_support_triage
    input_mapping_jsonb:
      request: state.request
    output_mapping_jsonb:
      reason: state.triage.reason
      summary: state.triage.summary
      category: state.triage.category
      draft_reply: state.triage.draft_reply
      secondary_reason: state.triage.secondary_reason
      secondary_category: state.triage.secondary_category
    error_policy:
      on_error: route_to_step
    optional: false
  - step_id: route
    step_kind: switch
    display_name: Choose a suggested human-review queue
    optional: false
    override:
      switch:
        cases:
        - when: billing
          label: Billing
          case_id: billing
        - when: technical
          label: Technical
          case_id: technical
        - when: account
          label: Account access
          case_id: account
        selector: state.triage.category
  - step_id: billing_queue
    step_kind: template
    display_name: Suggest Billing Support
    optional: false
    override:
      template:
        text: '{{ queue_name|default('''', true)|trim or ''Billing Support'' }}'
        format: text
        inputs:
        - name: queue_name
          type: text
          source: state.inputs.billing_queue_name
          required: false
        result_target: state.review_queue
  - step_id: technical_queue
    step_kind: template
    display_name: Suggest Technical Support
    optional: false
    override:
      template:
        text: '{{ queue_name|default('''', true)|trim or ''Technical Support'' }}'
        format: text
        inputs:
        - name: queue_name
          type: text
          source: state.inputs.technical_queue_name
          required: false
        result_target: state.review_queue
  - step_id: account_queue
    step_kind: template
    display_name: Suggest Account Access Review
    optional: false
    override:
      template:
        text: '{{ queue_name|default('''', true)|trim or ''Account Access Review''
          }}'
        format: text
        inputs:
        - name: queue_name
          type: text
          source: state.inputs.account_queue_name
          required: false
        result_target: state.review_queue
  - step_id: general_queue
    step_kind: template
    display_name: Suggest General Support Review
    optional: false
    override:
      template:
        text: '{{ queue_name|default('''', true)|trim or ''General Support Review''
          }}'
        format: text
        inputs:
        - name: queue_name
          type: text
          source: state.inputs.general_queue_name
          required: false
        result_target: state.review_queue
  - step_id: report
    step_kind: template
    display_name: Return the suggested queue and draft reply
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{% set supplied_policy = policy|default('''', true) %}

          # Support request triage for human review


          Request reference: {{ ticket_id }}

          Suggested review queue: {{ queue }}

          Classification: {% if triage.category in [''billing'',''technical'',''account'',''other'']
          %}{{ triage.category }}{% else %}Needs manual classification (unrecognized
          model category routed to general review){% endif %}


          ## Secondary issue review

          {% if secondary_queue|default('''', true) %}Secondary classification: {{
          triage.secondary_category }}

          Suggested secondary queue: {{ secondary_queue }}

          Evidence: {{ triage.secondary_reason }}

          {% elif triage.secondary_category|default('''', true) %}Secondary classification
          needs manual review: {{ triage.secondary_category }}. No separate queue
          was mapped because the category is unsupported or duplicates the primary
          category.

          {% else %}No separate secondary issue was identified.

          {% endif %}


          ## Issue summary

          {{ triage.summary }}


          ## Classification evidence

          {{ triage.reason }}


          ## Draft reply — not sent

          {{ triage.draft_reply }}


          ## Source coverage

          Request: {{ source|length }} characters supplied; {{ [source|length,12000]|min
          }} shown to the model.

          Approved policy: {{ supplied_policy|length }} characters supplied; {{ [supplied_policy|length,8000]|min
          }} shown to the model.

          {% if source|length > 12000 or supplied_policy|length > 8000 %}Partial-input
          review: text beyond these limits was not assessed.{% endif %}


          {% if not supplied_policy %}No approved policy was supplied. The model received
          the marker Not provided; no refund eligibility, policy rule or commitment
          is authorized by this input.{% endif %}


          ## Human review

          - [ ] Confirm the category against the actual issue and approved policy.

          - [ ] Confirm the suggested queue is appropriate for your organization.

          - [ ] Verify the draft does not promise an unperformed refund, account change
          or escalation.

          - [ ] Approve and send any response through your own support system.


          This is a proposed routing decision and a draft. No ticket was assigned,
          resolved or updated; no refund, account operation, escalation or message
          send occurred. Unknown categories use the general-review branch and its
          configured queue. Actual helpdesk/email/Slack connectors are not included.

          '
        format: markdown
        inputs:
        - name: ticket_id
          type: text
          source: state.inputs.ticket_id
          required: true
        - name: queue
          type: text
          source: state.review_queue
          required: true
        - name: triage
          type: object
          source: state.triage
          required: true
        - name: source
          type: text
          source: state.inputs.support_request
          required: true
        - name: policy
          type: text
          source: state.inputs.approved_policy
          required: false
        - name: secondary_queue
          type: text
          source: state.secondary_review_queue
          required: false
        result_target: state.report
  - step_id: done
    step_kind: stop_success
    display_name: Support triage draft ready
    optional: false
    override:
      stop_success:
        message: Support triage draft ready for human review
  - step_id: stop_fail
    step_kind: stop_fail
    display_name: Support classification could not be completed
    optional: false
    override:
      stop_fail:
        message: The model provider could not complete support classification. No
          queue was assigned and no reply was sent. Check the classification step
          for provider details, then retry or route the request for manual review.
  - step_id: template
    step_kind: template
    display_name: Resolve a separate secondary review queue
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{%- set category = triage.secondary_category|default('''', true)|trim|lower
          -%}

          {%- set defaults = {''billing'':''Billing Support'',''technical'':''Technical
          Support'',''account'':''Account Access Review'',''other'':''General Support
          Review''} -%}

          {%- if category in defaults and category != triage.category -%}{{ settings.get((''general''
          if category == ''other'' else category) ~ ''_queue_name'', '''')|default('''',
          true)|trim or defaults[category] }}{%- endif -%}'
        format: text
        inputs:
        - name: triage
          type: object
          source: state.triage
          required: true
        - name: settings
          type: object
          source: state.inputs
          required: true
        result_target: state.secondary_review_queue
  groups: []
  for_each: []
  execution_graph:
