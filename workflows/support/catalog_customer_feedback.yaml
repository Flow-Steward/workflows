schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  exported_at: '2026-10-29T12:05:01+00:00'
  exported_by: admin
  source_workflow_id: catalog_customer_feedback
  portability_kind: workflow_bundle
  flow_steward_version: 0.9.3
  triggers: []
workflows:
- workflow_id: catalog_customer_feedback
  version: 1.0.0
  display_name: Turn customer feedback into a prioritized action plan
  description: Review up to 100 feedback records and 30,000 characters. Get validated
    sentiment ID lists, calculated counts, source-grounded themes and proposed actions
    for human review. Duplicate or missing IDs and larger inputs stop before a report
    is accepted. Manual text input only; CSV upload, batch processing and external
    system updates are not implemented. Uses a native model provider with a reusable
    classification skill.
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      input_schema: {}
      strict_inputs: true
      expected_inputs:
      - name: feedback_text
        type: paragraph
        label: Customer feedback
        required: true
        description: 'Use one unique ID: feedback record per nonblank line. Example:
          F1: The export is fast. Put F2: Search is slow. on a separate line. IDs
          may contain up to 40 characters. Maximum 100 records and 30,000 total characters;
          larger, duplicate-ID or malformed input stops before the model, without
          truncation. Distinct IDs stay distinct when text matches. Remove unrelated
          personal details.'
      - name: product_context
        type: paragraph
        label: Product and analysis context
        required: true
        description: Describe the product or service and what decision this feedback
          should inform. Include your priority definitions if you have them.
      expected_outputs:
      - name: report
        type: paragraph
        label: Feedback action plan
        required: true
        description: Record-level sentiment, reconciled counts, themes, urgent issues,
          and proposed actions with source evidence.
      - name: sentiment_counts
        type: object
        label: Sentiment counts
        required: true
      - name: positive_ids
        type: array
        label: Positive source IDs
        required: true
      - name: neutral_ids
        type: array
        label: Neutral source IDs
        required: true
      - name: negative_ids
        type: array
        label: Negative source IDs
        required: true
      - name: mixed_ids
        type: array
        label: Mixed source IDs
        required: true
      - name: unclassified_ids
        type: array
        label: Unclassified source IDs
        required: true
      - name: themes
        type: paragraph
        label: Source-grounded themes
        required: true
      - name: proposed_actions
        type: paragraph
        label: Proposed actions — human review
        required: true
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
    participants: []
  participants: []
  tags: []
  steps:
  - step_id: template
    step_kind: template
    display_name: Prepare feedback evidence and analysis rules
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: 'REPORTING CONTEXT (guidance only, not feedback facts):

          {{ context }}

          END CONTEXT


          FEEDBACK RECORDS (one ID: feedback record per nonblank line; {{ source|length
          }} characters):

          {{ source }}

          END FEEDBACK'
        format: text
        inputs:
        - name: source
          type: text
          source: state.inputs.feedback_text
          required: true
        - name: context
          type: text
          source: state.inputs.product_context
          required: true
        result_target: state.request
  - step_id: agent
    step_kind: agent
    display_name: Classify feedback and propose next actions
    agent_id: catalog_feedback_analyst
    skill_id: catalog_feedback_classification
    input_mapping_jsonb:
      request: state.request
    output_mapping_jsonb:
      themes: state.themes
      mixed_ids: state.feedback_buckets.mixed
      neutral_ids: state.feedback_buckets.neutral
      negative_ids: state.feedback_buckets.negative
      positive_ids: state.feedback_buckets.positive
      proposed_actions: state.proposed_actions
      unclassified_ids: state.feedback_buckets.unclassified
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      published_block_key: agent.catalog_feedback_analyst.catalog_feedback_classification
  - step_id: stop_success
    step_kind: stop_success
    display_name: Feedback action plan ready
    optional: false
    override:
      stop_success:
        message: Feedback analysis is ready for human review.
  - step_id: check_input
    step_kind: template
    display_name: Check bounded ID-labelled feedback input
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{% set ns = namespace(ids=[], invalid=false) %}{% for line in source.split(''\n'')
          %}{% if line|trim %}{% set parts=line.split('':'', 1) %}{% if parts|length
          != 2 or not parts[0]|trim or not parts[1]|trim or parts[0]|trim|length >
          40 %}{% set ns.invalid=true %}{% else %}{% set ns.ids=ns.ids+[parts[0]|trim]
          %}{% endif %}{% endif %}{% endfor %}{% if source|length <= 30000 and ns.ids|length
          > 0 and ns.ids|length <= 100 and ns.ids|unique|list|length == ns.ids|length
          and not ns.invalid %}valid{% else %}invalid{% endif %}'
        format: text
        inputs:
        - name: source
          type: text
          source: state.inputs.feedback_text
          required: true
        result_target: state.feedback_input_check
  - step_id: require_input
    step_kind: if
    display_name: Require unique feedback IDs within input limits
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          value: valid
          operator: equals
          selector: state.feedback_input_check
  - step_id: check_coverage
    step_kind: template
    display_name: Validate exact unique source ID coverage
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{% set ns=namespace(ids=[]) %}{% for line in source.split(''\n'') %}{%
          if line|trim %}{% set ns.ids=ns.ids+[line.split('':'',1)[0]|trim] %}{% endif
          %}{% endfor %}{% set assigned=buckets.positive+buckets.neutral+buckets.negative+buckets.mixed+buckets.unclassified
          %}{% if buckets.positive is not string and buckets.neutral is not string
          and buckets.negative is not string and buckets.mixed is not string and buckets.unclassified
          is not string and assigned|length == ns.ids|length and assigned|unique|list|length
          == assigned|length and assigned|sort == ns.ids|sort and themes|trim and
          actions|trim %}valid{% else %}invalid{% endif %}'
        format: text
        inputs:
        - name: source
          type: text
          source: state.inputs.feedback_text
          required: true
        - name: buckets
          type: object
          source: state.feedback_buckets
          required: true
        - name: themes
          type: text
          source: state.themes
          required: true
        - name: actions
          type: text
          source: state.proposed_actions
          required: true
        result_target: state.feedback_coverage_check
  - step_id: require_coverage
    step_kind: if
    display_name: Require every source ID exactly once
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          value: valid
          operator: equals
          selector: state.feedback_coverage_check
  - step_id: count_sentiments
    step_kind: transform
    display_name: Count validated sentiment IDs deterministically
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      transform:
        mode: object
        input:
          source: state.feedback_buckets
        fields:
        - to: positive
          from: positive
          type: number
          actions:
          - action: array.length
        - to: neutral
          from: neutral
          type: number
          actions:
          - action: array.length
        - to: negative
          from: negative
          type: number
          actions:
          - action: array.length
        - to: mixed
          from: mixed
          type: number
          actions:
          - action: array.length
        - to: unclassified
          from: unclassified
          type: number
          actions:
          - action: array.length
        result_target: state.sentiment_counts
  - step_id: expose_ids
    step_kind: set_variable
    display_name: Expose reusable validated sentiment ID arrays
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.mixed_ids:
            source: state.feedback_buckets.mixed
          state.neutral_ids:
            source: state.feedback_buckets.neutral
          state.negative_ids:
            source: state.feedback_buckets.negative
          state.positive_ids:
            source: state.feedback_buckets.positive
          state.unclassified_ids:
            source: state.feedback_buckets.unclassified
  - step_id: format_report
    step_kind: template
    display_name: Format feedback evidence and native counts
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '# Customer feedback review


          ## Sentiment counts

          Counts are calculated from the validated source ID lists. Each source ID
          is included exactly once.


          | Sentiment | Records | Source IDs |

          |---|---:|---|

          {% for key in [''positive'',''neutral'',''negative'',''mixed'',''unclassified'']
          %}| {{ key }} | {{ counts[key] }} | {{ buckets[key]|join('', '') }} |

          {% endfor %}

          Total records: {{ counts.positive+counts.neutral+counts.negative+counts.mixed+counts.unclassified
          }}


          ## Source-grounded themes

          {{ themes }}


          ## Proposed actions — human review required

          {{ actions }}


          ## Coverage and scope

          All supplied source IDs occur exactly once across the five buckets. {{ source|length
          }} source characters supplied in this bounded manual batch (maximum 100
          records and 30,000 characters). Distinct IDs remain distinct even when text
          matches. A feature mention is not automatically a problem. Themes and proposed
          actions are interpretations for human review; the counts above are calculated
          from the listed IDs. No external system updates or customer messages occurred.

          '
        format: markdown
        inputs:
        - name: counts
          type: object
          source: state.sentiment_counts
          required: true
        - name: buckets
          type: object
          source: state.feedback_buckets
          required: true
        - name: themes
          type: text
          source: state.themes
          required: true
        - name: actions
          type: text
          source: state.proposed_actions
          required: true
        - name: source
          type: text
          source: state.inputs.feedback_text
          required: true
        result_target: state.report
  - step_id: feedback_failed
    step_kind: stop_fail
    display_name: Feedback input or classification could not be verified
    optional: false
    override:
      stop_fail:
        message: 'No verified feedback report was produced. Use one unique ID: feedback
          record per nonblank line, at most100 records and30000 characters. Inspect
          the failed step and model connection. Each source ID must occur in exactly
          one typed sentiment bucket; empty buckets are valid. No external updates
          or messages occurred.'
  groups: []
  for_each: []
  execution_graph:
    edges:
