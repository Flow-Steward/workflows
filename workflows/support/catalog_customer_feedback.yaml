    schema_version: 1
dependencies:
  agents:
  - agent_id: catalog_feedback_analyst
    display_name: Feedback Evidence Analyst
    required: true
    sources:
    - agent
    description: Classify each supplied feedback ID and provide source-grounded themes;
      native workflow steps own counts and coverage checks.
    version: 1.0.0
    enabled: true
  skills:
  - skill_id: catalog_feedback_classification
    display_name: Classify feedback by source ID without calculating totals
    required: true
    sources:
    - agent
    description: Assign each supplied feedback ID to one sentiment bucket and describe
      source-grounded themes and proposed actions. Native workflow steps calculate
      counts and validate exact ID coverage.
    version: 1.0.0
    enabled: true
  tools: []
  child_workflows: []
  published_blocks: []
  extensions: []
  project_connections: []
import_hints:
  default_enabled: false
  import_state: draft
  conflict_policy: rename_workflow
