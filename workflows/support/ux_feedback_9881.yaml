schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  exported_at: '2026-11-03T19:27:58+00:00'
  exported_by: admin
  source_workflow_id: ux_feedback_9881
  portability_kind: workflow_bundle
  flow_steward_version: 0.9.9
  triggers: []
  child_workflow_ids:
  - ux_feedback_batch
  - ux_feedback_update
workflows:
- workflow_id: ux_feedback_9881
  version: 1.0.0
  display_name: Classify customer feedback with allowed tags
  description: 'Tag new customer feedback in batches and update the feedback table.
    Adapted from https://n8n.io/workflows/9881/. Offline executor qualification: 15
    source scenarios passed with synthetic provider/model replies; no live API or
    import verification. Disabled on import. Configure released Google Workspace 0.3.3
    connections and an AI model. Complete reads are limited to 100 rows per table;
    use dedicated contiguous plain-value tables and one writer. Source forms/schedules
    and trusted current-time inputs require separate setup; only callable workflow
    structure is included. Select the model, validate setup and enable any included
    agents, skills and child workflows before enabling the main workflow.'
  trigger: {}
  settings:
    portability:
      import_state: draft
    callable:
      enabled: true
      input_mode: fields
      expected_inputs:
      - name: connection_ref
        type: string
        required: true
      - name: spreadsheet_id
        type: string
        required: true
      - name: processing_date
        type: string
        required: true
      - name: setup_confirmed
        type: boolean
        required: true
      expected_outputs: []
      trigger_channels:
      - ui
      - schedule
      - parent_workflow
  participants: []
  tags: []
  steps:
  - step_id: setup
    step_kind: template
    display_name: setup
    override:
      template:
        text: '{{ "ok" if ready and connection|trim and book|trim and date|length
          == 10 else "bad" }}'
        format: text
        inputs:
        - name: ready
          source: state.inputs.setup_confirmed
          type: boolean
          required: true
        - name: connection
          source: state.inputs.connection_ref
          type: text
          required: true
        - name: book
          source: state.inputs.spreadsheet_id
          type: text
          required: true
        - name: date
          source: state.inputs.processing_date
          type: text
          required: true
        result_target: state.check
  - step_id: setup_ok
    step_kind: if
    display_name: setup_ok
    override:
      if:
        condition: state.check == 'ok'
  - step_id: read_tags
    step_kind: connector
    display_name: read_tags
    connector_id: extension.flowsteward.google-workspace
    input_mapping_jsonb:
      connection_ref: state.inputs.connection_ref
      spreadsheet_id: state.inputs.spreadsheet_id
      sheet_title: literal:Tags
      header_mode: literal:first_row
    output_mapping_jsonb:
      result: state.tags_sheet
    override:
      connector:
        operation_id: read_google_sheet
        extension_id: flowsteward.google-workspace
  - step_id: tags_guard
    step_kind: template
    display_name: tags_guard
    override:
      template:
        text: '{% set ns=namespace(ok=true) %}{% if s.row_count > 100 or s.preview|length
          != s.row_count or s.column_count != 1 or s.schema|map(attribute=''name'')|list
          != [''Tags''] %}{% set ns.ok=false %}{% endif %}{% for r in s.preview %}{%
          if r.Tags is not string or r.Tags|trim == '''' %}{% set ns.ok=false %}{%
          endif %}{% endfor %}{{ ''ok'' if ns.ok else ''bad'' }}'
        format: text
        inputs:
        - name: s
          source: state.tags_sheet
          type: object
          required: true
        result_target: state.check
  - step_id: tags_ok
    step_kind: if
    display_name: tags_ok
    override:
      if:
        condition: state.check == 'ok'
  - step_id: read_feedback
    step_kind: connector
    display_name: read_feedback
    connector_id: extension.flowsteward.google-workspace
    input_mapping_jsonb:
      connection_ref: state.inputs.connection_ref
      spreadsheet_id: state.inputs.spreadsheet_id
      sheet_title: literal:Feedbacks
      header_mode: literal:first_row
    output_mapping_jsonb:
      result: state.feedback_sheet
    override:
      connector:
        operation_id: read_google_sheet
        extension_id: flowsteward.google-workspace
  - step_id: initialize
    step_kind: set_variable
    display_name: initialize
    override:
      set_variable:
        assignments:
          state.headers:
          - Feedbacks
          - Status
          - Tag 1
          - Tag 2
          - Tag 3
          - AI Tag 1
          - AI Tag 2
          - Sentiment
          - Primary Emotion
          - Secondary Emotion
          - Updated Date (N8N)
          state.eligible: []
  - step_id: feedback_guard
    step_kind: template
    display_name: feedback_guard
    override:
      template:
        text: '{% set ns=namespace(ok=true) %}{% if s.row_count > 100 or s.preview|length
          != s.row_count or s.column_count != 11 or s.schema|map(attribute=''name'')|list
          != headers %}{% set ns.ok=false %}{% endif %}{% for r in s.preview %}{%
          if r[''Feedbacks''] is not string or r[''Feedbacks'']|trim == '''' %}{%
          set ns.ok=false %}{% endif %}{% for h in headers %}{% if r[h] is not none
          and r[h] is not string and r[h] is not number and r[h] is not boolean %}{%
          set ns.ok=false %}{% endif %}{% endfor %}{% endfor %}{{ ''ok'' if ns.ok
          else ''bad'' }}'
        format: text
        inputs:
        - name: s
          source: state.feedback_sheet
          type: object
          required: true
        - name: headers
          source: state.headers
          type: array
          required: true
        result_target: state.check
  - step_id: feedback_ok
    step_kind: if
    display_name: feedback_ok
    override:
      if:
        condition: state.check == 'ok'
  - step_id: is_new
    step_kind: template
    for_each_id: scan
    display_name: is_new
    override:
      template:
        text: '{{ ''yes'' if r.Status is none or r.Status|string|trim == '''' else
          ''no'' }}'
        format: text
        inputs:
        - name: r
          source: state.feedback_row
          type: object
          required: true
        result_target: state.check
  - step_id: keep_new
    step_kind: if
    for_each_id: scan
    display_name: keep_new
    override:
      if:
        condition: state.check == 'yes'
  - step_id: wrap_row
    step_kind: set_variable
    for_each_id: scan
    display_name: wrap_row
    override:
      set_variable:
        assignments:
          state.wrapper: {}
          state.wrapper.row:
            source: state.feedback_row
          state.wrapper.position:
            source: state.row_index
  - step_id: identify
    step_kind: transform
    for_each_id: scan
    display_name: identify
    override:
      transform:
        input:
          source: state.wrapper
        mode: object
        fields:
        - from: row.Feedbacks
          to: text
          type: text
        - from: position
          to: row_number
          type: number
          actions:
          - action: number.add
            params:
              operand: 2
        result_target: state.identified
  - step_id: keep_feedback
    step_kind: collect
    for_each_id: scan
    display_name: keep_feedback
    override:
      collect:
        source: state.identified
        target: state.eligible
        mode: append
  - step_id: skip
    step_kind: continue
    for_each_id: scan
    display_name: skip
  - step_id: batch
    step_kind: batch
    display_name: batch
    override:
      batch:
        source_path: state.eligible
        batch_size: 10
        emit_partial_batch: true
        result_target: state.batches
  - step_id: classify_batch
    step_kind: invoke_workflow
    for_each_id: batches
    display_name: classify_batch
    override:
      invoke_workflow:
        workflow_id: ux_feedback_batch
        input_mapping:
          connection_ref: state.inputs.connection_ref
          spreadsheet_id: state.inputs.spreadsheet_id
          processing_date: state.inputs.processing_date
          setup_confirmed: state.inputs.setup_confirmed
          feedback_batch: state.feedback_batch
          allowed_tags: state.tags_sheet.preview
        output_mapping: {}
  - step_id: done
    step_kind: stop_success
    display_name: done
  - step_id: fail
    step_kind: stop_fail
    display_name: fail
  groups: []
  for_each:
  - for_each_id: scan
    group_id: null
    display_name: scan
    over: state.feedback_sheet.preview
    item_name: feedback_row
    index_name: row_index
    body:
      kind: sequence
      entry:
        kind: step
        id: is_new
  - for_each_id: batches
    group_id: null
    display_name: batches
    over: state.batches
    item_name: feedback_batch
    index_name: batch_index
    body:
      kind: sequence
      entry:
        kind: step
        id: classify_batch
  execution_graph:
    schema_version: 1
    entry:
      kind: step
      id: setup
    edges:
    - source:
        kind: step
        id: setup
      outcome:
        name: success
      target:
        kind: step
        id: setup_ok
      rework: false
    - source:
        kind: step
        id: read_tags
      outcome:
        name: success
      target:
        kind: step
        id: tags_guard
      rework: false
    - source:
        kind: step
        id: tags_guard
      outcome:
        name: success
      target:
        kind: step
        id: tags_ok
      rework: false
    - source:
        kind: step
        id: read_feedback
      outcome:
        name: success
      target:
        kind: step
        id: initialize
      rework: false
    - source:
        kind: step
        id: initialize
      outcome:
        name: success
      target:
        kind: step
        id: feedback_guard
      rework: false
    - source:
        kind: step
        id: feedback_guard
      outcome:
        name: success
      target:
        kind: step
        id: feedback_ok
      rework: false
    - source:
        kind: step
        id: is_new
      outcome:
        name: success
      target:
        kind: step
        id: keep_new
      rework: false
    - source:
        kind: step
        id: wrap_row
      outcome:
        name: success
      target:
        kind: step
        id: identify
      rework: false
    - source:
        kind: step
        id: identify
      outcome:
        name: success
      target:
        kind: step
        id: keep_feedback
      rework: false
    - source:
        kind: step
        id: setup_ok
      outcome:
        name: 'true'
      target:
        kind: step
        id: read_tags
      rework: false
    - source:
        kind: step
        id: setup_ok
      outcome:
        name: 'false'
      target:
        kind: step
        id: fail
      rework: false
    - source:
        kind: step
        id: tags_ok
      outcome:
        name: 'true'
      target:
        kind: step
        id: read_feedback
      rework: false
    - source:
        kind: step
        id: tags_ok
      outcome:
        name: 'false'
      target:
        kind: step
        id: fail
      rework: false
    - source:
        kind: step
        id: feedback_ok
      outcome:
        name: 'true'
      target:
        kind: for_each
        id: scan
      rework: false
    - source:
        kind: step
        id: feedback_ok
      outcome:
        name: 'false'
      target:
        kind: step
        id: fail
      rework: false
    - source:
        kind: step
        id: keep_new
      outcome:
        name: 'true'
      target:
        kind: step
        id: wrap_row
      rework: false
    - source:
        kind: step
        id: keep_new
      outcome:
        name: 'false'
      target:
        kind: step
        id: skip
      rework: false
    - source:
        kind: step
        id: keep_feedback
      outcome:
        name: success
      target:
        kind: for_each_exit
        for_each_id: scan
        lane_id: null
      rework: false
    - source:
        kind: for_each
        id: scan
      outcome:
        name: success
      target:
        kind: step
        id: batch
      rework: false
    - source:
        kind: step
        id: batch
      outcome:
        name: success
      target:
        kind: for_each
        id: batches
      rework: false
    - source:
        kind: step
        id: classify_batch
      outcome:
        name: success
      target:
        kind: for_each_exit
        for_each_id: batches
        lane_id: null
      rework: false
    - source:
        kind: for_each
        id: batches
      outcome:
        name: success
      target:
        kind: step
        id: done
      rework: false
- workflow_id: ux_feedback_batch
  version: 1.0.0
  display_name: Classify one feedback batch
  description: 'Classify a validated feedback batch using allowed tags and update
    each row. Adapted from https://n8n.io/workflows/9881/. Offline executor qualification:
    15 source scenarios passed with synthetic provider/model replies; no live API
    or import verification. Disabled on import. Configure released Google Workspace
    0.3.3 connections and an AI model. Complete reads are limited to 100 rows per
    table; use dedicated contiguous plain-value tables and one writer. Source forms/schedules
    and trusted current-time inputs require separate setup; only callable workflow
    structure is included. Select the model, validate setup and enable any included
    agents, skills and child workflows before enabling the main workflow.'
  trigger: {}
  settings:
    portability:
      import_state: draft
    callable:
      enabled: true
      input_mode: fields
      expected_inputs:
      - name: connection_ref
        type: string
        required: true
      - name: spreadsheet_id
        type: string
        required: true
      - name: processing_date
        type: string
        required: true
      - name: setup_confirmed
        type: boolean
        required: true
      - name: feedback_batch
        type: array
        required: true
      - name: allowed_tags
        type: array
        required: true
      expected_outputs: []
      trigger_channels:
      - parent_workflow
  participants: []
  tags: []
  steps:
  - step_id: tag
    step_kind: agent
    display_name: tag
    agent_id: ux_feedback_tagger
    skill_id: tag_feedback_batch
    input_mapping_jsonb:
      feedback_batch: state.inputs.feedback_batch
      allowed_tags: state.inputs.allowed_tags
    output_mapping_jsonb:
      results: state.results
  - step_id: validate_results
    step_kind: template
    display_name: validate_results
    override:
      template:
        text: '{% set ns=namespace(ok=true) %}{% if results is not sequence or results
          is string or results|length != batch|length %}{% set ns.ok=false %}{% else
          %}{% for r in results %}{% if r is not mapping %}{% set ns.ok=false %}{%
          else %}{% if r.row_number is not number or r.row_number != batch[loop.index0].row_number
          or r.tags is not sequence or r.tags is string or r.tags|length > 3 or r.tags|unique|list|length
          != r.tags|length %}{% set ns.ok=false %}{% endif %}{% for t in r.tags %}{%
          if t is not string or t not in allowed|map(attribute=''Tags'')|list %}{%
          set ns.ok=false %}{% endif %}{% endfor %}{% for key in [''ai_tag_1'',''ai_tag_2'',''sentiment'',''primary_emotion'',''secondary_emotion'']
          %}{% if r[key] is not string %}{% set ns.ok=false %}{% endif %}{% endfor
          %}{% if r.sentiment not in [''Very Negative'',''Negative'',''Neutral'',''Positive'',''Very
          Positive''] or r.primary_emotion|trim == '''' or (r.tags|length > 0 and
          (r.ai_tag_1 != '''' or r.ai_tag_2 != '''')) %}{% set ns.ok=false %}{% endif
          %}{% endif %}{% endfor %}{% endif %}{{ ''ok'' if ns.ok else ''bad'' }}'
        format: text
        inputs:
        - name: results
          source: state.results
          type: array
          required: true
        - name: batch
          source: state.inputs.feedback_batch
          type: array
          required: true
        - name: allowed
          source: state.inputs.allowed_tags
          type: array
          required: true
        result_target: state.check
  - step_id: valid
    step_kind: if
    display_name: valid
    override:
      if:
        condition: state.check == 'ok'
  - step_id: update_one
    step_kind: invoke_workflow
    for_each_id: results
    display_name: update_one
    override:
      invoke_workflow:
        workflow_id: ux_feedback_update
        input_mapping:
          connection_ref: state.inputs.connection_ref
          spreadsheet_id: state.inputs.spreadsheet_id
          processing_date: state.inputs.processing_date
          setup_confirmed: state.inputs.setup_confirmed
          classification: state.classification
        output_mapping: {}
  - step_id: done
    step_kind: stop_success
    display_name: done
  - step_id: fail
    step_kind: stop_fail
    display_name: fail
  groups: []
  for_each:
  - for_each_id: results
    group_id: null
    display_name: results
    over: state.results
    item_name: classification
    index_name: idx
    body:
      kind: sequence
      entry:
        kind: step
        id: update_one
  execution_graph:
    schema_version: 1
    entry:
      kind: step
      id: tag
    edges:
    - source:
        kind: step
        id: tag
      outcome:
        name: success
      target:
        kind: step
        id: validate_results
      rework: false
    - source:
        kind: step
        id: validate_results
      outcome:
        name: success
      target:
        kind: step
        id: valid
      rework: false
    - source:
        kind: step
        id: valid
      outcome:
        name: 'true'
      target:
        kind: for_each
        id: results
      rework: false
    - source:
        kind: step
        id: valid
      outcome:
        name: 'false'
      target:
        kind: step
        id: fail
      rework: false
    - source:
        kind: step
        id: update_one
      outcome:
        name: success
      target:
        kind: for_each_exit
        for_each_id: results
        lane_id: null
      rework: false
    - source:
        kind: for_each
        id: results
      outcome:
        name: success
      target:
        kind: step
        id: done
      rework: false
- workflow_id: ux_feedback_update
  version: 1.0.0
  display_name: Update one customer feedback row
  description: 'Update one classified feedback row while preserving the remaining
    table. Adapted from https://n8n.io/workflows/9881/. Offline executor qualification:
    15 source scenarios passed with synthetic provider/model replies; no live API
    or import verification. Disabled on import. Configure released Google Workspace
    0.3.3 connections and an AI model. Complete reads are limited to 100 rows per
    table; use dedicated contiguous plain-value tables and one writer. Source forms/schedules
    and trusted current-time inputs require separate setup; only callable workflow
    structure is included. Select the model, validate setup and enable any included
    agents, skills and child workflows before enabling the main workflow.'
  trigger: {}
  settings:
    portability:
      import_state: draft
    callable:
      enabled: true
      input_mode: fields
      expected_inputs:
      - name: connection_ref
        type: string
        required: true
      - name: spreadsheet_id
        type: string
        required: true
      - name: processing_date
        type: string
        required: true
      - name: setup_confirmed
        type: boolean
        required: true
      - name: classification
        type: object
        required: true
      expected_outputs: []
      trigger_channels:
      - parent_workflow
  participants: []
  tags: []
  steps:
  - step_id: fresh_read
    step_kind: connector
    display_name: fresh_read
    connector_id: extension.flowsteward.google-workspace
    input_mapping_jsonb:
      connection_ref: state.inputs.connection_ref
      spreadsheet_id: state.inputs.spreadsheet_id
      sheet_title: literal:Feedbacks
      header_mode: literal:first_row
    output_mapping_jsonb:
      result: state.fresh
    override:
      connector:
        operation_id: read_google_sheet
        extension_id: flowsteward.google-workspace
  - step_id: initialize
    step_kind: set_variable
    display_name: initialize
    override:
      set_variable:
        assignments:
          state.headers:
          - Feedbacks
          - Status
          - Tag 1
          - Tag 2
          - Tag 3
          - AI Tag 1
          - AI Tag 2
          - Sentiment
          - Primary Emotion
          - Secondary Emotion
          - Updated Date (N8N)
          state.matrix: []
  - step_id: fresh_guard
    step_kind: template
    display_name: fresh_guard
    override:
      template:
        text: '{% set ns=namespace(ok=true) %}{% if s.row_count > 100 or s.preview|length
          != s.row_count or s.column_count != 11 or s.schema|map(attribute=''name'')|list
          != headers %}{% set ns.ok=false %}{% endif %}{% for r in s.preview %}{%
          if r[''Feedbacks''] is not string or r[''Feedbacks'']|trim == '''' %}{%
          set ns.ok=false %}{% endif %}{% for h in headers %}{% if r[h] is not none
          and r[h] is not string and r[h] is not number and r[h] is not boolean %}{%
          set ns.ok=false %}{% endif %}{% endfor %}{% endfor %}{{ ''ok'' if ns.ok
          else ''bad'' }}{% if s.row_count < c.row_number - 1 or c.row_number < 2
          %}bad{% endif %}'
        format: text
        inputs:
        - name: s
          source: state.fresh
          type: object
          required: true
        - name: headers
          source: state.headers
          type: array
          required: true
        - name: c
          source: state.inputs.classification
          type: object
          required: true
        result_target: state.check
  - step_id: fresh_ok
    step_kind: if
    display_name: fresh_ok
    override:
      if:
        condition: state.check == 'ok'
  - step_id: wrap
    step_kind: set_variable
    for_each_id: rows
    display_name: wrap
    override:
      set_variable:
        assignments:
          state.row_wrapper: {}
          state.row_wrapper.row:
            source: state.live_row
          state.row_wrapper.position:
            source: state.live_index
          state.row_wrapper.c:
            source: state.inputs.classification
          state.row_wrapper.date:
            source: state.inputs.processing_date
  - step_id: position
    step_kind: transform
    for_each_id: rows
    display_name: position
    override:
      transform:
        input:
          source: state.row_wrapper
        mode: object
        fields:
        - from: position
          to: row_number
          type: number
          actions:
          - action: number.add
            params:
              operand: 2
        result_target: state.position
  - step_id: target
    step_kind: if
    for_each_id: rows
    display_name: target
    override:
      if:
        condition: state.position.row_number == state.inputs.classification.row_number
  - step_id: replace
    step_kind: transform
    for_each_id: rows
    display_name: replace
    override:
      transform:
        input:
          source: state.row_wrapper
        mode: object
        fields:
        - from: row["Feedbacks"]
          to: c01
          type: text
          default: ''
        - value:
            literal: ''
          to: c02
          type: text
        - from: c.tags
          to: c03
          type: json
          actions:
          - action: array.at
            params:
              index: 0
              default: ''
          default: []
        - from: c.tags
          to: c04
          type: json
          actions:
          - action: array.at
            params:
              index: 1
              default: ''
          default: []
        - from: c.tags
          to: c05
          type: json
          actions:
          - action: array.at
            params:
              index: 2
              default: ''
          default: []
        - from: c.ai_tag_1
          to: c06
          type: text
          default: ''
        - from: c.ai_tag_2
          to: c07
          type: text
          default: ''
        - from: c.sentiment
          to: c08
          type: text
          default: ''
        - from: c.primary_emotion
          to: c09
          type: text
          default: ''
        - from: c.secondary_emotion
          to: c10
          type: text
          default: ''
        - from: date
          to: c11
          type: text
          default: ''
        result_target: state.output_row
  - step_id: status
    step_kind: template
    for_each_id: rows
    display_name: status
    override:
      template:
        text: '{{ ''Updated'' if c.tags|length > 0 else ''Needs Review'' }}'
        format: text
        inputs:
        - name: c
          source: state.inputs.classification
          type: object
          required: true
        result_target: state.status
  - step_id: apply_status
    step_kind: set_variable
    for_each_id: rows
    display_name: apply_status
    override:
      set_variable:
        assignments:
          state.output_row.c02:
            source: state.status
  - step_id: retain
    step_kind: transform
    for_each_id: rows
    display_name: retain
    override:
      transform:
        input:
          source: state.row_wrapper
        mode: object
        fields:
        - from: row["Feedbacks"]
          to: c01
          type: json
          default: ''
        - from: row["Status"]
          to: c02
          type: json
          default: ''
        - from: row["Tag 1"]
          to: c03
          type: json
          default: ''
        - from: row["Tag 2"]
          to: c04
          type: json
          default: ''
        - from: row["Tag 3"]
          to: c05
          type: json
          default: ''
        - from: row["AI Tag 1"]
          to: c06
          type: json
          default: ''
        - from: row["AI Tag 2"]
          to: c07
          type: json
          default: ''
        - from: row["Sentiment"]
          to: c08
          type: json
          default: ''
        - from: row["Primary Emotion"]
          to: c09
          type: json
          default: ''
        - from: row["Secondary Emotion"]
          to: c10
          type: json
          default: ''
        - from: row["Updated Date (N8N)"]
          to: c11
          type: json
          default: ''
        result_target: state.output_row
  - step_id: values_wrapper
    step_kind: set_variable
    for_each_id: rows
    display_name: values_wrapper
    override:
      set_variable:
        assignments:
          state.values_wrapper: {}
          state.values_wrapper.row:
            source: state.output_row
  - step_id: values
    step_kind: transform
    for_each_id: rows
    display_name: values
    override:
      transform:
        input:
          source: state.values_wrapper
        mode: object
        fields:
        - from: row
          to: cells
          type: array
          actions:
          - action: json.values
        result_target: state.cells
  - step_id: append
    step_kind: collect
    for_each_id: rows
    display_name: append
    override:
      collect:
        source: state.cells.cells
        target: state.matrix
        mode: append
  - step_id: overwrite
    step_kind: connector
    display_name: overwrite
    connector_id: extension.flowsteward.google-workspace
    input_mapping_jsonb:
      connection_ref: state.inputs.connection_ref
      spreadsheet_id: state.inputs.spreadsheet_id
      sheet_title: literal:Feedbacks
      mode: literal:overwrite
      start_cell: literal:A2
      inline_rows: state.matrix
    output_mapping_jsonb:
      result: state.written
    override:
      connector:
        operation_id: write_google_sheet
        extension_id: flowsteward.google-workspace
  - step_id: done
    step_kind: stop_success
    display_name: done
  - step_id: fail
    step_kind: stop_fail
    display_name: fail
  groups: []
