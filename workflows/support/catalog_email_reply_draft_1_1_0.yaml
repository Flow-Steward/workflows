schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  exported_at: '2026-10-29T15:07:49+00:00'
  exported_by: admin
  source_workflow_id: catalog_email_reply_draft
  portability_kind: workflow_bundle
  flow_steward_version: 0.9.3
  triggers: []
workflows:
- workflow_id: catalog_email_reply_draft
  version: 1.1.0
  display_name: Draft a customer email reply from approved policies
  description: Paste a customer email and optional approved policy to receive separate
    category, boolean human-escalation flag, subject, reply body and review route,
    plus a readable report. Uses a native model provider and reusable policy skill.
    Missing policy permits only a neutral acknowledgement requiring human review.
    Manual input only; mailbox reading, Gmail draft creation, sending and account
    changes are not implemented.
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      input_schema: {}
      strict_inputs: true
      expected_inputs:
      - name: incoming_email
        type: paragraph
        label: Incoming email
        required: true
        description: Paste the email subject and message. Use sample data for testing;
          omit unrelated personal or account details.
      - name: response_policy
        type: paragraph
        label: Approved policies and reply guidance
        required: false
        description: Optional approved facts and reply rules. When absent, produce
          only a neutral acknowledgement and require human review; no policy decision
          or refund is assumed.
      expected_outputs:
      - name: report
        type: paragraph
        label: Customer reply draft and review checklist
        required: true
        description: Request classification, policy evidence, reply subject and body,
          unresolved questions, and escalation recommendations.
      - name: category
        type: string
        label: Email category
        required: true
      - name: needs_escalation
        type: boolean
        label: Human escalation required
        required: true
      - name: subject
        type: string
        label: Reply subject
        required: true
      - name: reply_body
        type: paragraph
        label: Reply body — draft, not sent
        required: true
      - name: review_route
        type: string
        label: Human review or routine draft route
        required: true
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
    participants: []
  participants: []
  tags: []
  steps:
  - step_id: template
    step_kind: template
    display_name: Prepare the email and approved reply rules
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: 'APPROVED RESPONSE POLICY (may be absent):

          {{ policy | default(''No approved response policy supplied.'', true) }}

          END POLICY


          INCOMING CUSTOMER EMAIL ({{ email|length }} characters):

          {{ email }}

          END EMAIL'
        format: text
        inputs:
        - name: email
          type: text
          source: state.inputs.incoming_email
          required: true
        - name: policy
          type: text
          source: state.inputs.response_policy
          required: false
        result_target: state.request
  - step_id: agent
    step_kind: agent
    display_name: Classify the request and draft a policy-grounded reply
    agent_id: catalog_policy_email_responder
    skill_id: catalog_policy_email_reply
    input_mapping_jsonb:
      request: state.request
    output_mapping_jsonb:
      reply_body: state.reply_body
      reply_subject: state.subject
      email_category: state.category
      needs_escalation: state.needs_escalation
    error_policy:
      on_error: route_to_step
    optional: false
  - step_id: stop_success
    step_kind: stop_success
    display_name: Reply draft ready for review
    optional: false
    override:
      stop_success:
        message: The customer reply is a draft for review; no email has been sent.
  - step_id: validate_reply
    step_kind: template
    display_name: Validate complete typed reply fields
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{% if category|trim in ["billing", "technical", "account", "feedback",
          "other"] and subject|trim and body|trim and body.split()|length <= 160 %}valid{%
          else %}invalid{% endif %}'
        format: text
        inputs:
        - name: category
          type: text
          source: state.category
          required: true
        - name: escalate
          type: boolean
          source: state.needs_escalation
          required: true
        - name: subject
          type: text
          source: state.subject
          required: true
        - name: body
          type: text
          source: state.reply_body
          required: true
        result_target: state.reply_validation
  - step_id: require_reply
    step_kind: if
    display_name: Require a complete policy reply
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          value: valid
          operator: equals
          selector: state.reply_validation
  - step_id: format_reply
    step_kind: template
    display_name: Format the reply review report
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '# Customer email reply draft


          Category: {{ category }}

          Human escalation required: {{ escalate }}


          ## Subject

          {{ subject }}


          ## Reply body

          {{ body }}


          Draft — not sent. No account changes, refund, ticket or escalation has been
          performed. When escalation is required, a human must decide the next action.'
        format: markdown
        inputs:
        - name: category
          type: text
          source: state.category
          required: true
        - name: escalate
          type: boolean
          source: state.needs_escalation
          required: true
        - name: subject
          type: text
          source: state.subject
          required: true
        - name: body
          type: text
          source: state.reply_body
          required: true
        result_target: state.report
  - step_id: route_escalation
    step_kind: if
    display_name: Route requests requiring human authority
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          operator: truthy
          selector: state.needs_escalation
  - step_id: human_review
    step_kind: set_variable
    display_name: Mark human review required
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.review_route: human_review
  - step_id: draft_ready
    step_kind: set_variable
    display_name: Mark routine reply draft ready
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.review_route: draft_ready
  - step_id: reply_failed
    step_kind: stop_fail
    display_name: Reply draft could not pass validation
    optional: false
    override:
      stop_fail:
        message: No usable policy-grounded reply was produced. Inspect the failed
          step and model connection. Required fields are category, boolean escalation,
          subject and a reply body of at most160 words. No email or account action
          occurred.
  groups: []
  for_each: []
