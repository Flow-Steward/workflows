schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  exported_at: '2026-10-29T15:07:49+00:00'
  exported_by: admin
  source_workflow_id: catalog_sales_csv_review
  portability_kind: workflow_bundle
  flow_steward_version: 0.9.3
  triggers: []
workflows:
- workflow_id: catalog_sales_csv_review
  version: 1.1.0
  display_name: Summarize sales CSV by region with a downloadable report
  description: Create a one-time regional sales review from an uploaded UTF-8 CSV.
    Configure exact source headers for order ID, region and revenue; choose automatic,
    comma, semicolon or tab separation, decimal-point or decimal-comma amounts, and
    an optional explicit currency. Native operations validate rows and unique order
    IDs, calculate revenue totals and order counts, and check complete coverage of
    1–1000 regional groups before model interpretation. Space-grouped numbers must
    be cleaned before upload. Returns reusable regional_summary data and a non-empty
    model-assisted report; the CSV download is available in Job Details, not as a
    callable File output. Invalid, empty or oversized regional summaries stop with
    an error; intermediate job files may remain. No currency conversion or external
    updates.
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      input_schema: {}
      strict_inputs: true
      expected_inputs:
      - name: sales_csv
        type: file
        label: Sales CSV file
        required: true
        description: Upload UTF-8 CSV with one row per unique order ID, a non-empty
          region and a numeric revenue amount. Default headers are order_id, region
          and revenue; configure exact source headers below when different. Choose
          automatic, comma, semicolon or tab separation and the matching revenue number
          format. Use one currency for the whole file; no conversion is performed.
      - name: analysis_context
        type: paragraph
        label: Sales period and review context
        required: true
        description: State the reporting period, currency, and questions. Context
          is not evidence for figures absent from the file.
      - name: csv_delimiter
        type: select
        label: CSV separator
        options:
        - auto
        - comma
        - semicolon
        - tab
        required: false
        description: Leave unselected or choose auto to detect the separator. Choose
          comma, semicolon or tab to override detection. Use the three column-name
          fields below when your source headers differ from order_id, region and revenue.
      - name: currency
        type: string
        label: Sales currency
        required: false
        description: Optional ISO currency code, for example EUR or USD. Use one currency
          for the whole file. Leave blank when unknown; the workflow must not infer
          or convert a currency.
      - name: order_id_column
        type: string
        label: Order ID column
        required: false
        description: Exact source header for unique order IDs. Leave blank to use
          order_id; for example Order ID.
      - name: region_column
        type: string
        label: Region column
        required: false
        description: Exact source header for region names. Leave blank to use region;
          for example Region.
      - name: revenue_column
        type: string
        label: Revenue column
        required: false
        description: Exact source header for revenue amounts. Leave blank to use revenue;
          for example Revenue (EUR). State the currency separately; it is not inferred
          from the header.
      - name: number_format
        type: select
        label: Revenue number format
        options:
        - decimal_point
        - decimal_comma
        required: false
        description: Leave unselected or choose decimal_point for amounts such as
          1200.50. Choose decimal_comma for amounts such as 1200,50 or 1.200,50. Space-grouped
          amounts are unsupported; remove grouping spaces before upload. Separators
          are normalized natively before validation; no currency conversion is performed.
      expected_outputs:
      - name: report
        type: paragraph
        label: Regional sales review
        required: true
        description: Complete native regional table, exact supplied currency or Not
          stated, source/delivery scope and exactly two validated qualitative proposals.
          The model does not write figures or calculate new metrics.
      - name: regional_summary
        type: array
        label: Regional sales totals
        required: true
        description: Native computed rows with region, revenue_total and order_count.
          The model does not calculate these values. Currency is not inferred.
      - name: sales_review_proposals
        type: array
        label: Proposed review checks
        required: true
        description: Exactly two validated qualitative proposals. No new numeric metrics
          or completed actions are claimed; native data remains in regional_summary.
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
    participants: []
  participants: []
  tags: []
  steps:
  - step_id: template
    step_kind: template
    display_name: Prepare the sales review context
    optional: false
    override:
      template:
        text: '{{ context }}


          Explicit sales currency: {{ currency|default("Not stated", true) }}. Use
          this currency only when supplied. Never infer currency, mix currencies or
          perform conversion.'
        format: text
        inputs:
        - name: context
          type: text
          source: state.inputs.analysis_context
          required: true
        - name: currency
          type: text
          source: state.inputs.currency
          required: false
        result_target: state.sales_context
  - step_id: agent
    step_kind: agent
    display_name: Propose two qualitative sales review checks
    agent_id: catalog_regional_sales_analyst
    skill_id: catalog_regional_sales_interpretation
    input_mapping_jsonb:
      request: state.request
    output_mapping_jsonb:
      sales_review_proposals: state.sales_review_proposals
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      published_block_key: agent.catalog_regional_sales_analyst.catalog_regional_sales_interpretation
  - step_id: stop_success
    step_kind: stop_success
    display_name: The report is ready for human review. No external updates have been
      performed.
    optional: false
    override:
      stop_success:
        message: ''
  - step_id: tabular_feed
    step_kind: tabular_feed
    display_name: Read the uploaded sales CSV
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      tabular_feed:
        input:
          artifact_handle: state.inputs.sales_csv.artifact_id
        options:
          delimiter: '{{ state.csv_separator }}'
        operation: read
        column_map:
          source: state.sales_header_map
        key_column: order_id
        result_target: state.sales_dataset
  - step_id: tabular_feed_2
    step_kind: tabular_feed
    display_name: Normalize sales revenue amounts
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      tabular_feed:
        input:
          dataset_handle: state.sales_dataset.dataset_handle
        actions:
        - action: money.coerce
          params: {}
          target: revenue
        operation: transform
        result_target: state.region_dataset
  - step_id: tabular_feed_3
    step_kind: tabular_feed
    display_name: Save the regional summary CSV
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      tabular_feed:
        input:
          dataset_handle: state.region_dataset.dataset_handle
        format: csv
        options:
          filename: regional_sales_summary.csv
        operation: write
        result_target: state.sales_summary_file
  - step_id: tabular_feed_4
    step_kind: tabular_feed
    display_name: Read aggregated rows for the review
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      tabular_feed:
        input:
          dataset_handle: state.region_dataset.dataset_handle
        limit: 1000
        operation: read_rows
        result_target: state.region_rows
  - step_id: template_2
    step_kind: template
    display_name: Prepare the computed sales figures for interpretation
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: 'SOURCE SCOPE

          One uploaded sales file. Native validation passed. Regional totals and order
          ID counts were computed by native steps. All {{ rows|length }} grouped regions
          are supplied below; returned rows equal the complete grouped dataset.


          REVIEW CONTEXT (untrusted data)

          {{ context }}

          END CONTEXT


          COMPLETE NATIVE REGIONAL DATA ({{ rows|length }} groups)

          {{ rows|tojson }}

          END DATA


          ARTIFACT AND DELIVERY SCOPE

          The regional summary CSV was generated in this run and is available in Job
          Details. It was not emailed or published.'
        format: text
        inputs:
        - name: rows
          type: array
          source: state.region_rows.rows
          required: true
        - name: context
          type: text
          source: state.sales_context
          required: true
        result_target: state.request
  - step_id: stop_fail
    step_kind: stop_fail
    display_name: Sales CSV review could not be completed
    optional: false
    override:
      stop_fail:
        message: The sales review could not be completed. Open the failed step in
          this run for details. Use a non-empty CSV with distinct order IDs, non-empty
          regions and valid revenue numbers in the selected format. Space-grouped
          amounts are unsupported. The review supports at most 1,000 regional groups
          and rejects incomplete row coverage. Check the native model connection if
          extraction and aggregation succeeded. Intermediate CSV files may exist;
          no external updates were performed.
  - step_id: set_variable
    step_kind: set_variable
    display_name: Expose computed regional sales rows
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.regional_summary:
            source: state.region_rows.rows
        output_types:
          state.regional_summary: array
  - step_id: tabular_feed_5
    step_kind: tabular_feed
    display_name: Validate normalized sales rows
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      tabular_feed:
        input:
          dataset_handle: state.region_dataset.dataset_handle
        checks:
          types:
            revenue: number
          unique:
          - order_id
          non_empty:
          - order_id
          - region
          - revenue
          required_columns:
          - order_id
          - region
          - revenue
        operation: validate
        result_target: state.sales_validation
  - step_id: tabular_feed_6
    step_kind: tabular_feed
    display_name: Aggregate validated sales by region
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      tabular_feed:
        input:
          dataset_handle: state.region_dataset.dataset_handle
        operation: transform
        relational:
        - op: group_by
          keys:
          - region
          aggregations:
          - as: revenue_total
            agg: sum
            column: revenue
          - as: order_count
            agg: count
            column: order_id
        result_target: state.region_dataset
  - step_id: if
    step_kind: if
    display_name: Require complete valid sales rows
    optional: false
    override:
      if:
        condition:
          operator: truthy
          selector: state.sales_validation.valid
  - step_id: template_3
    step_kind: template
    display_name: Resolve CSV separator
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{% set separator = separator|default(''auto'', true) %}{% if separator
          == ''comma'' %},{% elif separator == ''semicolon'' %};{% elif separator
          == ''tab'' %}\t{% endif %}'
        format: text
        inputs:
        - name: separator
          type: text
          source: state.inputs.csv_delimiter
          required: false
        result_target: state.csv_separator
  - step_id: tabular_feed_7
    step_kind: tabular_feed
    display_name: Prepare CSV header mapping pairs
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      tabular_feed:
        rows:
        - source_name: '{{ state.inputs.order_id_column | default: ''order_id'' }}'
          canonical_name: order_id
        - source_name: '{{ state.inputs.region_column | default: ''region'' }}'
          canonical_name: region
        - source_name: '{{ state.inputs.revenue_column | default: ''revenue'' }}'
          canonical_name: revenue
        operation: create_dataset
        result_target: state.sales_header_pairs
  - step_id: set_variable_2
    step_kind: set_variable
    display_name: Initialize CSV header map
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.sales_header_map: {}
        output_types:
          state.sales_header_map: object
  - step_id: map_one_source_header_to_its_canonical_name
    step_kind: collect
    for_each_id: for_each
    display_name: Map one source header to its canonical name
    optional: false
    override:
      collect:
        key:
          source: state.sales_header_pair.source_name
        mode: set_key
        source: state.sales_header_pair.canonical_name
        target: state.sales_header_map
  - step_id: tabular_feed_8
    step_kind: tabular_feed
    display_name: Normalize decimal-comma revenue text
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      tabular_feed:
        input:
          dataset_handle: state.sales_dataset.dataset_handle
        actions:
        - action: text.trim
          params: {}
          target: revenue
        - action: text.replace
          params:
            find: .
            replace_with: ''
          target: revenue
        - action: text.replace
          params:
            find: ','
            replace_with: .
          target: revenue
        operation: transform
        result_target: state.sales_dataset
  - step_id: if_2
    step_kind: if
    display_name: Check whether revenue uses decimal commas
    optional: false
    override:
      if:
        condition:
          value: decimal_comma
          operator: equals
          selector: state.inputs.number_format
  - step_id: if_3
    step_kind: if
    display_name: Require at least one regional group
    optional: false
    override:
      if:
        condition:
          value: 0
          operator: gt
          selector: state.region_rows.returned
  - step_id: if_4
    step_kind: if
    display_name: Require complete regional row coverage
    optional: false
    override:
      if:
        condition:
          value: state.region_dataset.row_count
          operator: equals
          selector: state.region_rows.returned
  - step_id: tabular_feed_9
    step_kind: tabular_feed
    display_name: Inspect original CSV headers
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      tabular_feed:
        input:
          artifact_handle: state.inputs.sales_csv.artifact_id
        options:
          delimiter: '{{ state.csv_separator }}'
        operation: inspect
        result_target: state.sales_csv_inspection
  - step_id: stop_fail_2
    step_kind: stop_fail
    display_name: CSV import needs correction
    optional: false
    override:
      stop_fail:
        message: The CSV could not be imported with the selected separator and column
          names. Check the source-header fields and open the Explain CSV import error
          step in this run for the requested headers, actual headers and reader error.
          No sales totals or external updates were produced.
  - step_id: template_4
    step_kind: template
    display_name: Explain CSV import error
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '# CSV import needs correction


          Requested source columns:

          - Order ID: {{ order_id_column|default(''order_id'', true) }}

          - Region: {{ region_column|default(''region'', true) }}

          - Revenue: {{ revenue_column|default(''revenue'', true) }}


          Found source columns:

          {% set info = inspection|default({}, true) %}{% for column in info.get(''columns'',
          []) %}- {{ column.name }}

          {% else %}Original headers could not be inspected.

          {% endfor %}

          Reader or inspection errors from this run:

          {% set ns = namespace(found=false) %}{% for message in messages %}{% if
          message.get(''step_id'') in [''tabular_feed'', ''tabular_feed_9''] and message.get(''errors'')
          %}{% set ns.found=true %}{% for error in message.errors %}- {{ error }}

          {% endfor %}{% endif %}{% endfor %}{% if not ns.found %}Open the failed
          reader or inspection step for its detailed error.

          {% endif %}

          Match the source headers exactly, use three distinct columns and select
          the correct CSV separator. This workflow did not calculate sales totals
          or update external systems.'
        format: markdown
        inputs:
        - name: messages
          type: array
          source: state.agent_messages
          required: true
        - name: inspection
          type: object
          source: state.sales_csv_inspection
          required: false
        - name: order_id_column
          type: text
          source: state.inputs.order_id_column
          required: false
        - name: region_column
          type: text
          source: state.inputs.region_column
          required: false
        - name: revenue_column
          type: text
          source: state.inputs.revenue_column
          required: false
        result_target: state.report
  - step_id: if_5
    step_kind: if
    display_name: Require a non-empty sales report
    optional: false
    override:
      if:
        condition:
          operator: truthy
          selector: state.outputs.report
  - step_id: validate_proposals
    step_kind: template
    display_name: Validate two proposals without new numbers or metrics
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{% set ns=namespace(bad=false) %}{% if proposals is string or proposals
          is mapping or proposals is not sequence or proposals|length!=2 or proposals|unique|list|length!=2
          %}{% set ns.bad=true %}{% endif %}{% for proposal in proposals %}{% if proposal
          is not string or not proposal|trim or proposal|length>240 or proposal.splitlines()|length!=1
          or ''|'' in proposal %}{% set ns.bad=true %}{% else %}{% set item=namespace(clean=proposal)
          %}{% for row in rows %}{% set item.clean=item.clean|replace(''`''~(row.get(''region'')|string)~''`'','''')
          %}{% endfor %}{% set lower=item.clean|lower %}{% if not lower.startswith((''consider
          '',''review '',''validate '',''confirm '',''investigate '',''compare '',''check
          '')) %}{% set ns.bad=true %}{% endif %}{% for ch in item.clean %}{% if ch.isdigit()
          or ch in ''$€£¥%'' %}{% set ns.bad=true %}{% endif %}{% endfor %}{% for
          phrase in [''grand total'',''cross-region'',''cross region'',''overall total'',''total
          revenue across'',''total orders across'',''more than'',''less than''] %}{%
          if phrase in lower %}{% set ns.bad=true %}{% endif %}{% endfor %}{% for
          tok in lower.split() %}{% set word=tok.strip(''.,:;!?()[]{}"“”'') %}{% if
          word in [''average'',''averages'',''mean'',''means'',''median'',''medians'',''percent'',''percentage'',''percentages'',''ratio'',''ratios'',''growth'',''forecast'',''forecasts'',''forecasting'',''profit'',''profits'',''profitability'',''highest'',''lowest'',''leading'',''lagging'',''largest'',''smallest'',''twice'',''double'',''doubled'',''doubling'',''triple'',''tripled'',''half'',''halved'',''combined'']
          %}{% set ns.bad=true %}{% endif %}{% endfor %}{% endif %}{% endfor %}{%
          if ns.bad %}invalid{% else %}valid{% endif %}'
        format: text
        inputs:
        - name: proposals
          type: array
          source: state.sales_review_proposals
          required: true
        - name: rows
          type: array
          source: state.region_rows.rows
          required: true
        result_target: state.sales_proposal_check
  - step_id: require_proposals
    step_kind: if
    display_name: Require exactly two qualitative proposals
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          value: valid
          operator: equals
          selector: state.sales_proposal_check
  - step_id: format_native_report
    step_kind: template
    display_name: Render all regional figures directly from native data
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '# Regional sales review


          ## Native regional figures

          Currency: {{ currency|default('''',true)|trim or ''Not stated'' }}. No currency
          inference or conversion was performed.

          Regions returned: {{ rows|length }}. Every row of the complete grouped dataset
          is shown below.


          | Region | Revenue total | Order ID count |

          | --- | ---: | ---: |

          {% for row in rows %}| {{ row.region|string|replace(''|'',''\|'')|replace(''\n'',''
          '')|replace(''\r'','' '') }} | {{ row.revenue_total }} | {{ row.order_count
          }} |

          {% endfor %}

          ## Proposed review checks

          These are optional human review proposals, not computed conclusions or actions
          already performed.

          {% for proposal in proposals %}- {{ proposal }}

          {% endfor %}

          ## Source and delivery scope

          One uploaded CSV passed native header, amount, nonempty-region and distinct-order-ID
          validation. Regional revenue totals and order ID counts come directly from
          native grouping; the model did not write or recalculate this table. No cross-region
          sum, average, percentage, ranking, forecast, profitability or other-period
          result is claimed.

          The regional summary CSV was generated in this run and is available in Job
          Details. It was not emailed or published. First-class callable File output
          mapping is not connected. This is a one-shot sales-file review, not an interactive
          chatbot or independent financial audit.


          ## Human review

          - [ ] Check the source file, column mapping and reporting period.

          - [ ] Confirm that the file uses one currency and the selected amount format.

          - [ ] Review the native regional figures and consider the proposed checks.

          '
        format: markdown
        inputs:
        - name: rows
          type: array
          source: state.region_rows.rows
          required: true
        - name: currency
          type: text
          source: state.inputs.currency
          required: false
        - name: proposals
          type: array
          source: state.sales_review_proposals
          required: true
        result_target: state.outputs.report
  - step_id: invalid_proposals
    step_kind: stop_fail
    display_name: Proposals failed the qualitative-only contract
    optional: false
    override:
      stop_fail:
        message: No verified sales review report was returned because model proposals
          were not exactly two concise qualitative checks or introduced unsupported
          numbers/metrics. Native regional_summary and CSV may already be available
          for inspection; no external updates were performed.
  groups: []
  for_each:
  - for_each_id: for_each
    group_id: null
    display_name: Build CSV header map
    description: Build a native source-to-canonical header map from exactly three
      configured names.
    over: state.sales_header_pairs.preview_rows
    item_name: sales_header_pair
    index_name: null
    body:
      kind: sequence
      entry:
        id: map_one_source_header_to_its_canonical_name
        kind: step
    error_policy:
      on_error: route_to_step
  execution_graph:
    edges:
    - rework: false
      source:
        id: tabular_feed_3
        kind: step
      target:
        id: tabular_feed_4
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: template_2
        kind: step
      target:
        id: agent
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: set_variable
        kind: step
      target:
        id: template_2
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: set_variable
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: tabular_feed_4
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: tabular_feed_2
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: tabular_feed_3
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: agent
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: tabular_feed_6
        kind: step
      target:
        id: tabular_feed_3
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: tabular_feed_6
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: if
        kind: step
      target:
        id: tabular_feed_6
        kind: step
      outcome:
        name: 'true'
    - rework: false
      source:
        id: if
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: 'false'
    - rework: false
      source:
        id: tabular_feed_5
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: tabular_feed_5
        kind: step
      target:
        id: if
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: tabular_feed_2
        kind: step
      target:
        id: tabular_feed_5
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: template_3
