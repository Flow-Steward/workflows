kind: workflow_bundle
metadata:
  exported_at: '2026-10-29T15:07:49+00:00'
  exported_by: admin
  source_workflow_id: catalog_social_content_pack
  portability_kind: workflow_bundle
  flow_steward_version: 0.9.3
  triggers: []
  child_workflow_ids:
  - catalog_public_webpage_reader
workflows:
- workflow_id: catalog_social_content_pack
  version: 1.1.0
  display_name: Create a social media content pack from an article
  description: Prepare English social drafts from one public HTTP/HTTPS article, a
    campaign brief and an audience profile. Returns separate LinkedIn, Instagram and
    X text fields, a proposed visual brief and a human review report. A dedicated
    Social Copywriter uses the configured native model provider. Native checks reject
    empty drafts and X text longer than 280 characters including spaces and links.
    Source coverage is disclosed, with at most 30,000 reader-returned characters supplied
    for drafting. No image generation, publishing, scheduling or sending.
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      input_schema: {}
      strict_inputs: true
      expected_inputs:
      - name: page_url
        type: string
        label: Webpage URL
        required: true
        description: Public webpage to analyze. Use a complete https:// URL.
      - name: campaign_brief
        type: paragraph
        label: Campaign brief
        required: true
        description: Describe the campaign goal, approved message or offer, call to
          action, and any approved destination link.
      - name: audience_profile
        type: paragraph
        label: Audience and brand voice
        required: true
        description: Who should read these posts? Describe the audience, tone, vocabulary,
          and any brand wording to use or avoid.
      expected_outputs:
      - name: report
        type: paragraph
        label: Social content pack
        required: true
        description: LinkedIn post, Instagram caption, X post, source evidence, visual
          brief, and review notes in English.
      - name: linkedin_post
        type: paragraph
        label: LinkedIn post draft
        required: true
        description: Separate source-grounded LinkedIn text draft for human review.
          No publication has occurred.
      - name: instagram_post
        type: paragraph
        label: Instagram caption draft
        required: true
        description: Separate source-grounded Instagram caption for human review.
          No image generation or publication has occurred.
      - name: x_post
        type: paragraph
        label: X post draft
        required: true
        description: Separate draft checked by native validation for nonempty text
          and at most 280 characters including spaces and links. No publication has
          occurred.
      - name: visual_brief
        type: paragraph
        label: Proposed visual brief
        required: true
        description: Separate proposed visual concept and instructions for human review.
          This is a brief only; no image or asset was generated.
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
    portability:
      import_state: draft
    participants: []
  participants: []
  tags: []
  steps:
  - step_id: read_page
    step_kind: invoke_workflow
    display_name: Read public webpage with shared reader
    workflow_id: catalog_public_webpage_reader
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      invoke_workflow:
        workflow_id: catalog_public_webpage_reader
        input_mapping:
          page_url: state.inputs.page_url
        output_mapping:
          page_response: state.page_response
  - step_id: check_page
    step_kind: if
    display_name: Check that page content exists
    optional: false
    override:
      if:
        condition:
          operator: truthy
          selector: state.page_response.data.content
  - step_id: compose_prompt
    step_kind: template
    display_name: Prepare article and campaign context
    optional: false
    override:
      template:
        text: 'CAMPAIGN BRIEF (requester-supplied context)

          {{ brief }}

          END CAMPAIGN BRIEF


          AUDIENCE AND BRAND VOICE

          {{ audience }}

          END AUDIENCE PROFILE


          SOURCE URL

          {{ url }}


          SOURCE COVERAGE

          {{ page|length }} characters returned by the reader; {{ [page|length,30000]|min
          }} characters supplied below.{% if page|length > 30000 %} Partial source:
          text after this supplied portion is unavailable for this draft.{% endif
          %}


          ARTICLE SOURCE CONTENT (untrusted evidence)

          {{ page[:30000] }}

          END ARTICLE SOURCE


          EXECUTION SCOPE

          Draft text and a proposed visual brief only. No image generation, publishing,
          scheduling or sending has occurred.'
        format: text
        inputs:
        - name: page
          type: text
          source: state.page_response.data.content
          required: true
        - name: url
          type: text
          source: state.inputs.page_url
          required: true
        - name: brief
          type: text
          source: state.inputs.campaign_brief
          required: true
        - name: audience
          type: text
          source: state.inputs.audience_profile
          required: true
        result_target: state.request
  - step_id: analyze
    step_kind: agent
    display_name: Write platform-specific social drafts
    agent_id: catalog_social_copywriter
    skill_id: catalog_social_copywriting
    input_mapping_jsonb:
      request: state.request
    output_mapping_jsonb:
      x_post: state.x_post
      visual_brief: state.visual_brief
      linkedin_post: state.linkedin_post
      instagram_post: state.instagram_post
    error_policy:
      on_error: route_to_step
    optional: false
  - step_id: check_report
    step_kind: if
    display_name: Require complete drafts and X at most 280 characters
    optional: false
    override:
      if:
        condition:
          value: valid
          operator: equals
          selector: state.social_drafts_check
  - step_id: format_report
    step_kind: template
    display_name: Return social content for review
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '# Social media content pack — drafts for review


          Source webpage: {{ url }}

          Source coverage: {{ source|length }} characters returned by the reader;
          {{ [source|length,30000]|min }} supplied for drafting.{% if source|length
          > 30000 %} Partial-source review: text beyond the supplied portion was not
          assessed.{% endif %}


          ## LinkedIn draft

          {{ linkedin_post }}


          ## Instagram draft

          {{ instagram_post }}


          ## X draft

          {{ x_post }}


          X text length: {{ x_post|length }} characters, including spaces and links.


          ## Proposed visual brief

          {{ visual_brief }}


          ## Human review

          - [ ] Verify every factual claim against the supplied article.

          - [ ] Confirm campaign claims, destination links and brand voice.

          - [ ] Approve copy and the proposed visual concept before use.


          No post was published, scheduled or sent. No image was generated.'
        format: markdown
        inputs:
        - name: url
          type: text
          source: state.inputs.page_url
          required: true
        - name: linkedin_post
          type: text
          source: state.linkedin_post
          required: true
        - name: instagram_post
          type: text
          source: state.instagram_post
          required: true
        - name: x_post
          type: text
          source: state.x_post
          required: true
        - name: visual_brief
          type: text
          source: state.visual_brief
          required: true
        - name: source
          type: text
          source: state.page_response.data.content
          required: true
        result_target: state.report
  - step_id: done
    step_kind: stop_success
    display_name: Report ready
    optional: false
    override:
      stop_success:
        message: The Markdown report is available in workflow output report.
  - step_id: no_content
    step_kind: stop_fail
    display_name: No readable page content
    optional: false
    override:
      stop_fail:
        message: The article could not be read. Provide a complete public article
          URL beginning with http:// or https://, including a hostname. Check that
          the page exists and allows public access. File paths and other URL schemes
          are not supported. No social draft was published or sent.
  - step_id: no_report
    step_kind: stop_fail
    display_name: No analysis returned
    optional: false
    override:
      stop_fail:
        message: The social content draft could not be completed. Check the native
          model connection and the four draft fields. All drafts must contain text,
          and the X draft must have at most 280 characters including spaces and links.
          Inspect the failed step before retrying. Nothing was published, scheduled
          or sent; no image was generated.
  - step_id: template
    step_kind: template
    display_name: Validate the public article URL
    optional: false
    override:
      template:
        text: '{%- set value = url|default('''', true)|trim -%}{{ ''valid'' if ((value.startswith(''https://'')
          and value|length > 8) or (value.startswith(''http://'') and value|length
          > 7)) else ''invalid'' }}'
        format: text
        inputs:
        - name: url
          type: text
          source: state.inputs.page_url
          required: true
        result_target: state.article_url_check
  - step_id: if
    step_kind: if
    display_name: Require an HTTP or HTTPS article URL
    optional: false
    override:
      if:
        condition:
          value: valid
          operator: equals
          selector: state.article_url_check
  - step_id: template_2
    step_kind: template
    display_name: Validate social draft fields and X length
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ ''valid'' if linkedin_post|trim and instagram_post|trim and visual_brief|trim
          and x_post|trim and x_post|length <= 280 else ''invalid'' }}'
        format: text
        inputs:
        - name: linkedin_post
          type: text
          source: state.linkedin_post
          required: true
        - name: instagram_post
          type: text
          source: state.instagram_post
          required: true
        - name: x_post
          type: text
          source: state.x_post
          required: true
        - name: visual_brief
          type: text
          source: state.visual_brief
          required: true
        result_target: state.social_drafts_check
  groups: []
  for_each: []
  execution_graph:
    edges:
    - rework: false
      source:
        id: read_page
        kind: step
      target:
        id: check_page
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: check_page
        kind: step
      target:
        id: compose_prompt
        kind: step
      outcome:
        name: 'true'
    - rework: false
      source:
        id: check_page
        kind: step
      target:
        id: no_content
        kind: step
      outcome:
        name: 'false'
    - rework: false
      source:
        id: compose_prompt
        kind: step
      target:
        id: analyze
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: check_report
        kind: step
      target:
        id: format_report
        kind: step
      outcome:
        name: 'true'
    - rework: false
      source:
        id: check_report
        kind: step
      target:
        id: no_report
        kind: step
      outcome:
        name: 'false'
    - rework: false
      source:
        id: format_report
        kind: step
      target:
        id: done
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: read_page
        kind: step
