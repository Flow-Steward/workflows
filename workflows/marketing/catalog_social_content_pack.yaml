        kind: step
      outcome:
        name: error
    entry:
      id: template
      kind: step
    schema_version: 1
- workflow_id: catalog_public_webpage_reader
  version: 1.0.0
  display_name: Read one public webpage with source metadata
  description: Reusable native reader for one public HTTP/HTTPS page. Returns the
    Jina Reader response with extracted content and available source metadata for
    downstream workflows. No model rewriting, crawling, publishing or external writes.
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      input_schema: {}
      strict_inputs: true
      expected_inputs:
      - name: page_url
        type: string
        label: Public webpage URL
        required: true
        description: One complete public http:// or https:// URL. No credentials or
          private document links. The reader does not crawl linked pages.
      expected_outputs:
      - name: page_response
        type: object
        label: Reader response and source metadata
        required: true
        description: Structured Jina Reader response. data.content is the extracted
          page text; data.title, data.url and other metadata are preserved when returned
          by the source. No model rewriting.
      trigger_channels:
      - ui
      - parent_workflow
    participants: []
  participants: []
  tags: []
  steps:
  - step_id: http_request
    step_kind: http_request
    display_name: Read public content through Jina Reader
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      http_request:
        url: https://r.jina.ai/{{ state.inputs.page_url }}
        method: GET
        headers:
          Accept: application/json
          X-Timeout: '30'
          X-Respond-With: markdown
        auth_ref: ''
        auth_mode: none
        query_params: {}
        body_template: ''
        response_mode: inline
        response_target: state.page_response
        timeout_seconds: 45
        expected_statuses:
        - 200
        max_response_bytes: 150000
  - step_id: if
    step_kind: if
    display_name: Require readable source content
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          operator: truthy
          selector: state.page_response.data.content
  - step_id: stop_success
    step_kind: stop_success
    display_name: Return readable page and source metadata
    optional: false
    override:
      stop_success:
        message: Public webpage content was read. Review the returned source metadata
          and content before relying on downstream claims.
  - step_id: stop_fail
    step_kind: stop_fail
    display_name: Stop when the public page cannot be read
    optional: false
    override:
      stop_fail:
        message: The public page could not be read or returned no readable content.
          Provide a complete public http:// or https:// URL, check that the page exists
          and is accessible, then retry. No downstream model or publishing action
          was run.
  - step_id: template
    step_kind: template
    display_name: Validate public webpage URL scheme
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{%- set value = url|default('''', true)|trim -%}

          {{ ''valid'' if ((value.startswith(''https://'') and value|length > 8) or
          (value.startswith(''http://'') and value|length > 7)) else ''invalid'' }}'
        format: text
        inputs:
        - name: url
          type: text
          source: state.inputs.page_url
          required: true
        result_target: state.url_check
  - step_id: if_2
    step_kind: if
    display_name: Require complete HTTP or HTTPS URL
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          value: valid
          operator: equals
          selector: state.url_check
  groups: []
  for_each: []
  execution_graph:
    edges:
    - rework: false
      source:
        id: http_request
        kind: step
      target:
        id: if
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: if
        kind: step
      target:
        id: stop_success
        kind: step
      outcome:
        name: 'true'
    - rework: false
      source:
        id: if
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: 'false'
    - rework: false
      source:
        id: if
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: http_request
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: template
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: template
        kind: step
      target:
        id: if_2
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: if_2
        kind: step
      target:
        id: http_request
        kind: step
      outcome:
        name: 'true'
    - rework: false
      source:
        id: if_2
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: 'false'
    - rework: false
      source:
        id: if_2
        kind: step
      target:
        id: stop_fail
        kind: step
      outcome:
        name: error
    entry:
      id: template
      kind: step
    schema_version: 1
dependencies:
  agents:
  - agent_id: catalog_social_copywriter
    display_name: Social Copywriter
    required: true
    sources:
    - analyze
    description: Writes source-grounded platform-specific drafts and proposed visual
      briefs using a reusable social copywriting skill. No publishing tools.
    version: 1.0.0
    enabled: true
  skills:
  - skill_id: catalog_social_copywriting
    display_name: Write source-grounded social platform drafts
    required: true
    sources:
    - analyze
    description: Return separate LinkedIn, Instagram and X text drafts plus a proposed
      visual brief from supplied article evidence, campaign context and audience.
      No publishing or image generation.
    version: 1.0.0
    enabled: true
  tools: []
  child_workflows:
  - workflow_id: catalog_public_webpage_reader
    display_name: Read one public webpage with source metadata
    required: true
    sources:
    - read_page
    - workflow_runtime_dependencies
    description: Reusable native reader for one public HTTP/HTTPS page. Returns the
      Jina Reader response with extracted content and available source metadata for
      downstream workflows. No model rewriting, crawling, publishing or external writes.
    version: 1.0.0
    enabled: true
  published_blocks: []
  extensions: []
  project_connections: []
import_hints:
  default_enabled: false
  import_state: draft
  conflict_policy: rename_workflow
