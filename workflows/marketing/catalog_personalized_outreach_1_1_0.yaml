schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  exported_at: '2026-10-29T15:07:49+00:00'
  exported_by: admin
  source_workflow_id: catalog_personalized_outreach
  portability_kind: workflow_bundle
  flow_steward_version: 0.9.3
  triggers: []
  child_workflow_ids:
  - catalog_public_webpage_reader
workflows:
- workflow_id: catalog_personalized_outreach
  version: 1.1.0
  display_name: Draft personalized marketing emails from company research
  description: Draft personalized English outreach from one public company webpage,
    a recipient profile and an approved campaign brief. Returns two subjects, an initial
    email, a separate follow-up and a personalization note as individual fields plus
    a review report. Draft-only mode is the default. Optional initial-email sending
    requires a recipient and human approval of the exact address, subject and body;
    follow-ups are never sent automatically. Uses the native provider and Outgoing
    Email extensions; an approved email is sent through the project's Outgoing Email
    connection. Recipient profile text is sent to the configured model provider; include
    only appropriate information.
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      input_schema: {}
      strict_inputs: true
      expected_inputs:
      - name: page_url
        type: string
        label: Webpage URL
        required: true
        description: Public webpage to analyze. Use a complete https:// URL.
      - name: campaign_brief
        type: paragraph
        label: Campaign brief
        required: true
        description: Describe your offer, sender, approved benefits, tone, and desired
          call to action. Include only claims you can support.
      - name: recipient_profile
        type: paragraph
        label: Recipient profile
        required: true
        description: Provide the recipient first name, role, company and relevant
          facts you already know. This text is sent to the model provider configured
          through the native provider extension. Include only information appropriate
          for that provider; avoid sensitive personal data. An email address is not
          needed for draft generation.
      - name: send_email
        type: boolean
        label: Request sending after human approval
        required: false
        description: Leave off to generate drafts only. Turning this on requests a
          human approval decision before the initial email can be sent through the
          project SMTP connection. It never sends the follow-up automatically.
      - name: recipient_email
        type: string
        label: Recipient email for approved sending
        required: false
        description: Optional for draft generation. Required when requesting sending.
          Verify this address together with the subject and body in the approval step.
          The email is sent through the project's Outgoing Email connection.
      expected_outputs:
      - name: report
        type: paragraph
        label: Email draft pack
        required: true
        description: Two subject options, an initial email, a follow-up, personalization
          evidence, and review notes in English.
      - name: subject_a
        type: string
        label: Subject option A
        required: true
      - name: subject_b
        type: string
        label: Subject option B
        required: true
      - name: email_body
        type: paragraph
        label: Initial email draft
        required: true
      - name: followup_body
        type: paragraph
        label: Follow-up draft
        required: true
      - name: personalization_note
        type: paragraph
        label: Personalization evidence and uncertainties
        required: true
      - name: email_delivered
        type: boolean
        label: Initial email delivered
        required: false
        description: Present only when the approved send action runs. Test Runs suppress
          actual delivery; inspect this result separately from the draft report.
      - name: delivery_status
        type: string
        label: Delivery effect status
        required: false
        description: Present only when the approved send action runs. Test Runs suppress
          actual delivery; inspect this result separately from the draft report.
      - name: provider_message_id
        type: string
        label: SMTP message identifier
        required: false
        description: Present only when the approved send action runs. Test Runs suppress
          actual delivery; inspect this result separately from the draft report.
      - name: recipient_count
        type: number
        label: Delivery recipient count
        required: false
        description: Present only when the approved send action runs. Test Runs suppress
          actual delivery; inspect this result separately from the draft report.
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
    portability:
      import_state: draft
    participants: []
  participants: []
  tags: []
  steps:
  - step_id: read_page
    step_kind: invoke_workflow
    display_name: Read public webpage with shared reader
    workflow_id: catalog_public_webpage_reader
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      invoke_workflow:
        workflow_id: catalog_public_webpage_reader
        input_mapping:
          page_url: state.inputs.page_url
        output_mapping:
          page_response: state.page_response
  - step_id: check_page
    step_kind: if
    display_name: Check that page content exists
    optional: false
    override:
      if:
        condition:
          operator: truthy
          selector: state.page_response.data.content
  - step_id: compose_prompt
    step_kind: template
    display_name: Prepare source, campaign and recipient context
    optional: false
    override:
      template:
        text: 'REQUESTER-SUPPLIED CAMPAIGN BRIEF:

          {{ brief }}

          END CAMPAIGN BRIEF


          REQUESTER-SUPPLIED RECIPIENT PROFILE:

          {{ profile }}

          END RECIPIENT PROFILE


          Source URL: {{ url }}

          Reader-returned characters: {{ page|length }}

          Supplied characters: {{ page[:30000]|length }}

          {% if page|length > 30000 %}Coverage: partial reader extraction, first30000characters
          only.{% else %}Coverage: complete reader-returned extraction of this one
          page.{% endif %}


          COMPANY WEBPAGE CONTENT:

          {{ page[:30000] }}

          END COMPANY WEBPAGE CONTENT'
        format: text
        inputs:
        - name: page
          type: text
          source: state.page_response.data.content
          required: true
        - name: url
          type: text
          source: state.inputs.page_url
          required: true
        - name: brief
          type: text
          source: state.inputs.campaign_brief
          required: true
        - name: profile
          type: text
          source: state.inputs.recipient_profile
          required: true
        result_target: state.request
  - step_id: analyze
    step_kind: agent
    display_name: Write personalized email drafts
    agent_id: catalog_outreach_writer
    skill_id: catalog_outreach_copy
    input_mapping_jsonb:
      request: state.request
    output_mapping_jsonb:
      subject_a: state.subject_a
      subject_b: state.subject_b
      email_body: state.email_body
      followup_body: state.followup_body
      personalization_note: state.personalization_note
    error_policy:
      on_error: route_to_step
    optional: false
  - step_id: check_report
    step_kind: if
    display_name: Require a non-empty email draft
    optional: false
    override:
      if:
        condition:
          operator: truthy
          selector: state.email_body
  - step_id: format_report
    step_kind: template
    display_name: Return email drafts for review
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '# Personalized marketing email drafts


          Source webpage: {{ url }}


          Source coverage: {% if source_text|length > 30000 %}first 30,000 of {{ source_text|length
          }} extracted characters{% else %}complete {{ source_text|length }}-character
          extraction of this one page{% endif %}.


          ## Subject options

          A: {{ subject_a }}


          B: {{ subject_b }}


          ## Initial email

          {{ email_body }}


          ## Follow-up draft

          {{ followup_body }}


          ## Personalization evidence and uncertainties

          {{ personalization_note }}


          Drafts require human review. If sending was requested, check the separate
          delivery result fields and approval decision. The follow-up draft is not
          sent automatically.'
        format: markdown
        inputs:
        - name: url
          type: text
          source: state.inputs.page_url
          required: true
        - name: subject_a
          type: text
          source: state.subject_a
          required: true
        - name: subject_b
          type: text
          source: state.subject_b
          required: true
        - name: email_body
          type: text
          source: state.email_body
          required: true
        - name: followup_body
          type: text
          source: state.followup_body
          required: true
        - name: personalization_note
          type: text
          source: state.personalization_note
          required: true
        - name: source_text
          type: text
          source: state.page_response.data.content
          required: true
        result_target: state.report
  - step_id: done
    step_kind: stop_success
    display_name: Report ready
    optional: false
    override:
      stop_success:
        message: The Markdown report is available in workflow output report.
  - step_id: no_content
    step_kind: stop_fail
    display_name: No readable page content
    optional: false
    override:
      stop_fail:
        message: The webpage URL is unsupported or no readable page content is available.
          Use a complete lowercase http:// or https:// public URL and check access
          restrictions. Unsupported schemes stop before the reader or model runs.
  - step_id: no_report
    step_kind: stop_fail
    display_name: Draft or requested delivery could not be completed
    optional: false
    override:
      stop_fail:
        message: Draft generation or the requested delivery could not be completed.
          If sending was requested, supply a recipient email and review the approval
          decision. Open the failed step in Job Details for the original cause. If
          a send action ran, inspect its external effect status and the mailbox before
          retrying, to avoid duplicate delivery.
  - step_id: approval
    step_kind: approval
    display_name: Approve the exact initial email before sending
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      approval:
        message: Review the recipient address, subject option A and complete initial
          email body below. Approve only if the recipient and factual wording are
          correct and sending is authorized. Approving sends it through the project's
          Outgoing Email connection. Rejecting returns the drafts without sending.
          Follow-up drafts are never sent automatically.
        show_outputs:
        - state.inputs.recipient_email
        - state.subject_a
        - state.email_body
        - state.personalization_note
  - step_id: extension_tools
    step_kind: connector
    display_name: Send the approved initial email
    connector_id: extension.flowsteward.outgoing-email
    connector_install_id: 596491e2-6a53-4bfa-8f27-2ff3904cc230
    input_mapping_jsonb:
      to: state.inputs.recipient_email
      subject: state.subject_a
      body_text: state.email_body
    output_mapping_jsonb:
      delivered: state.email_delivered
      recipient_count: state.recipient_count
      provider_message_id: state.provider_message_id
      external_effect_status: state.delivery_status
    connection_binding_jsonb:
      connection_id: conn_4c8e40acfa8745c6
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      connector:
        action_id: ''
        extension_id: flowsteward.outgoing-email
        operation_id: send_email
        function_name: ''
        input_mapping:
          to: state.inputs.recipient_email
          subject: state.subject_a
          body_text: state.email_body
        output_mapping:
          delivered: state.email_delivered
          recipient_count: state.recipient_count
          provider_message_id: state.provider_message_id
          external_effect_status: state.delivery_status
        connection_binding:
          connection_id: conn_4c8e40acfa8745c6
  - step_id: if
    step_kind: if
    display_name: Require a recipient before requesting approval
    optional: false
    override:
      if:
        condition:
          operator: truthy
          selector: state.inputs.recipient_email
  - step_id: if_2
    step_kind: if
    display_name: Check whether sending was explicitly requested
    optional: false
    override:
      if:
        condition:
          operator: truthy
          selector: state.inputs.send_email
  - step_id: template
    step_kind: template
    display_name: Validate webpage URL scheme
    optional: false
    override:
      template:
        text: '{{ ''allowed'' if page_url[:8] == ''https://'' or page_url[:7] == ''http://''
          else ''blocked'' }}'
        format: text
        inputs:
        - name: page_url
          type: text
          source: state.inputs.page_url
          required: true
        result_target: state.url_scheme
  - step_id: if_3
    step_kind: if
    display_name: Require an HTTP or HTTPS webpage URL
    optional: false
    override:
      if:
        condition:
          value: allowed
          operator: equals
          selector: state.url_scheme
