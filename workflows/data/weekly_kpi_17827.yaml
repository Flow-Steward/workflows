schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  exported_at: '2026-11-03T19:27:58+00:00'
  exported_by: admin
  source_workflow_id: weekly_kpi_17827
  portability_kind: workflow_bundle
  flow_steward_version: 0.9.9
  triggers: []
workflows:
- workflow_id: weekly_kpi_17827
  version: 1.0.0
  display_name: Weekly KPI HTML report
  description: 'Email a KPI summary with deterministic totals and an AI executive
    summary. Adapted from https://n8n.io/workflows/17827/. Offline executor qualification:
    28 source scenarios passed with synthetic provider/model replies; no live API
    or import verification. Disabled on import. Configure released Google Workspace
    0.3.3 and Outgoing Email/SMTP 0.3.1 connections and an AI model. Complete reads
    are limited to 100 rows per table; use dedicated contiguous plain-value tables
    and one writer. SMTP replaces Gmail sending. Source forms/schedules and trusted
    current-time inputs require separate setup; only callable workflow structure is
    included. Select the model, validate setup and enable any included agents, skills
    and child workflows before enabling the main workflow.'
  trigger:
    type: schedule
    cron: 0 8 * * 1
    timezone: UTC
    enabled: false
  settings:
    callable:
      enabled: true
      trigger_channels:
      - schedule
      - ui
      input_mode: fields
      strict_inputs: true
      expected_inputs:
      - name: setup_ready
        type: boolean
        required: true
      - name: model_binding_ready
        type: boolean
        required: true
      - name: spreadsheet_id
        type: text
        required: true
      - name: google_connection_ref
        type: text
        required: true
      - name: recipient
        type: text
        required: true
      - name: report_date
        type: text
        required: true
    migration_schedule:
      source: Monday 08:00 source-instance timezone unspecified
      activation_required: true
      timezone_decision: UTC explicit adaptation; configure scheduler and render report_date
        as d LLLL yyyy
  participants: []
  tags:
  - migration
  - '17827'
  steps:
  - step_id: setup_guard
    step_kind: template
    display_name: setup_guard
    error_policy:
      on_error: route_to_step
    override:
      template:
        text: '{%- if not ready or not model_ready or not spreadsheet_id|trim or not
          connection_ref|trim or not recipient|trim or not report_date|trim -%}{{
          missing_setup }}{%- endif -%}ready'
        format: text
        inputs:
        - name: ready
          type: boolean
          required: true
          source: state.inputs.setup_ready
        - name: model_ready
          type: boolean
          required: true
          source: state.inputs.model_binding_ready
        - name: spreadsheet_id
          type: text
          required: true
          source: state.inputs.spreadsheet_id
        - name: connection_ref
          type: text
          required: true
          source: state.inputs.google_connection_ref
        - name: recipient
          type: text
          required: true
          source: state.inputs.recipient
        - name: report_date
          type: text
          required: true
          source: state.inputs.report_date
        result_target: state.setup_status
  - step_id: read_metrics
    step_kind: connector
    connector_id: extension.flowsteward.google-workspace
    input_mapping_jsonb:
      connection_ref: state.inputs.google_connection_ref
      spreadsheet_id: state.inputs.spreadsheet_id
      sheet_title: literal:Metrics
      header_mode: literal:first_row
    output_mapping_jsonb:
      result.preview: state.metric_rows
      result.row_count: state.metric_row_count
    error_policy:
      on_error: route_to_step
    override:
      connector:
        operation_id: read_google_sheet
        extension_id: flowsteward.google-workspace
  - step_id: validate_metrics
    step_kind: template
    display_name: validate_metrics
    error_policy:
      on_error: route_to_step
    override:
      template:
        text: "{%- if count > 100 or rows|length != count -%}{{ incomplete_or_oversized_sheet\
          \ }}{%- endif -%}\n{%- for r in rows -%}\n {%- set name = r.get('Metric')\
          \ or r.get('metric') or r.get('KPI') or 'Metric' -%}\n {%- if name is not\
          \ string or name|length > 256 -%}{{ invalid_metric_name }}{%- endif -%}\n\
          \ {%- set raw = r.get('Value') if r.get('Value') is not none else r.get('value')\
          \ -%}\n {%- if raw is none or raw is boolean or (raw is not string and raw\
          \ is not number) -%}{{ invalid_value }}{%- endif -%}\n {%- set s=raw|string|trim\
          \ -%}\n {%- set unsigned=s[1:] if s[:1] in ['-','+'] else s -%}\n {%- set\
          \ parts=unsigned.split('.') -%}\n {%- if not unsigned or parts|length >\
          \ 2 or parts[0]|length == 0 or parts[0]|length > 12 or (parts|length ==\
          \ 2 and (parts[1]|length == 0 or parts[1]|length > 2)) -%}{{ invalid_decimal\
          \ }}{%- endif -%}\n {%- for char in unsigned -%}{%- if char not in '0123456789.'\
          \ -%}{{ invalid_decimal_character }}{%- endif -%}{%- endfor -%}\n{%- endfor\
          \ -%}valid"
        format: text
        inputs:
        - name: rows
          type: array
          required: true
          source: state.metric_rows
        - name: count
          type: number
          required: true
          source: state.metric_row_count
        result_target: state.metrics_validation
  - step_id: compute_kpis
    step_kind: template
    display_name: compute_kpis
    error_policy:
      on_error: route_to_step
    override:
      template:
        text: '{%- set ns=namespace(names=[]) -%}

          {%- for r in rows -%}{%- set name=r.get(''Metric'') or r.get(''metric'')
          or r.get(''KPI'') or ''Metric'' -%}{%- if name not in ns.names -%}{%- set
          ns.names=ns.names+[name] -%}{%- endif -%}{%- endfor -%}

          {%- for name in ns.names -%}

          {%- set acc=namespace(total=0,count=0) -%}

          {%- for r in rows -%}

          {%- if (r.get(''Metric'') or r.get(''metric'') or r.get(''KPI'') or ''Metric'')
          == name -%}

          {%- set raw=r.get(''Value'') if r.get(''Value'') is not none else r.get(''value'')
          -%}

          {%- set s=raw|string|trim -%}{%- set sign=-1 if s[:1]==''-'' else 1 -%}{%-
          set u=s[1:] if s[:1] in [''-'',''+''] else s -%}{%- set p=u.split(''.'')
          -%}

          {%- set cents=(p[0]|int)*100 + (((p[1] ~ ''00'')[:2]|int) if p|length==2
          else 0) -%}

          {%- set acc.total=acc.total+sign*cents -%}{%- set acc.count=acc.count+1
          -%}

          {%- endif -%}{%- endfor -%}

          {%- set total=(2*acc.total+100)//200 -%}{%- set average=(2*acc.total+100*acc.count)//(200*acc.count)
          -%}

          {{ name }}: total {{ total }}, avg {{ average }}{{ ''\n'' if not loop.last
          else '''' }}{%- else -%}No metrics: 0 source rows.{%- endfor -%}'
        format: text
        inputs:
        - name: rows
          type: array
          required: true
          source: state.metric_rows
        result_target: state.kpi_summary
  - step_id: executive_summary
    step_kind: agent
    agent_id: weekly_kpi_analyst
    input_mapping_jsonb:
      kpi_evidence: state.kpi_summary
    output_mapping_jsonb:
      executive_summary: state.executive_summary
    error_policy:
      on_error: route_to_step
  - step_id: validate_model
    step_kind: template
    display_name: validate_model
    error_policy:
      on_error: route_to_step
    override:
      template:
        text: '{%- if executive_summary is not string or not executive_summary|trim
          or executive_summary|length > 5000 -%}{{ invalid_model_summary }}{%- endif
          -%}valid'
        format: text
        inputs:
        - name: executive_summary
          type: json
          required: true
          source: state.executive_summary
        result_target: state.model_validation
  - step_id: render_report
    step_kind: template
    display_name: render_report
    error_policy:
      on_error: route_to_step
    override:
      template:
        text: '<div style="font-family: Arial, sans-serif; max-width: 640px; margin:
          auto; color: #222;"><h2 style="color:#111;">Weekly report</h2><p style="font-size:15px;
          line-height:1.5;">{{ executive_summary }}</p><table style="width:100%; border-collapse:collapse;
          margin-top:16px;"><tr style="background:#f4f4f5; text-align:left;"><th style="padding:8px;
          border-bottom:1px solid #ddd;">Metric</th><th style="padding:8px; border-bottom:1px
          solid #ddd;">Total</th><th style="padding:8px; border-bottom:1px solid #ddd;">Average</th></tr>{%-
          set ns=namespace(names=[]) -%}

          {%- for r in rows -%}{%- set name=r.get(''Metric'') or r.get(''metric'')
          or r.get(''KPI'') or ''Metric'' -%}{%- if name not in ns.names -%}{%- set
          ns.names=ns.names+[name] -%}{%- endif -%}{%- endfor -%}

          {%- for name in ns.names -%}

          {%- set acc=namespace(total=0,count=0) -%}

          {%- for r in rows -%}

          {%- if (r.get(''Metric'') or r.get(''metric'') or r.get(''KPI'') or ''Metric'')
          == name -%}

          {%- set raw=r.get(''Value'') if r.get(''Value'') is not none else r.get(''value'')
          -%}

          {%- set s=raw|string|trim -%}{%- set sign=-1 if s[:1]==''-'' else 1 -%}{%-
          set u=s[1:] if s[:1] in [''-'',''+''] else s -%}{%- set p=u.split(''.'')
          -%}

          {%- set cents=(p[0]|int)*100 + (((p[1] ~ ''00'')[:2]|int) if p|length==2
          else 0) -%}

          {%- set acc.total=acc.total+sign*cents -%}{%- set acc.count=acc.count+1
          -%}

          {%- endif -%}{%- endfor -%}

          {%- set total=(2*acc.total+100)//200 -%}{%- set average=(2*acc.total+100*acc.count)//(200*acc.count)
          -%}

          <tr><td style="padding:8px; border-bottom:1px solid #eee;">{{ name }}</td><td
          style="padding:8px; border-bottom:1px solid #eee;">{{ total }}</td><td style="padding:8px;
          border-bottom:1px solid #eee;">{{ average }}</td></tr>{%- endfor -%}</table><p
          style="color:#888; font-size:12px; margin-top:16px;">Generated automatically
          from {{ rows|length }} rows.</p></div>'
        format: html
        inputs:
        - name: rows
          type: array
          required: true
          source: state.metric_rows
        - name: executive_summary
          type: text
          required: true
          source: state.executive_summary
        result_target: state.report_html
  - step_id: render_subject
    step_kind: template
    display_name: render_subject
    error_policy:
      on_error: route_to_step
    override:
      template:
        text: Weekly report - {{ report_date }}
        format: text
        inputs:
        - name: report_date
          type: text
          required: true
          source: state.inputs.report_date
        result_target: state.report_subject
  - step_id: email_report
    step_kind: connector
    connector_id: extension.flowsteward.outgoing-email
    input_mapping_jsonb:
      to: state.inputs.recipient
      subject: state.report_subject
      body_html: state.report_html
    output_mapping_jsonb:
      delivered: state.delivered
      provider_message_id: state.provider_message_id
    error_policy:
      on_error: route_to_step
    override:
      connector:
        operation_id: send_email
        extension_id: flowsteward.outgoing-email
  - step_id: done
    step_kind: stop_success
  - step_id: failed
    step_kind: stop_fail
  groups: []
  for_each: []
  execution_graph:
    schema_version: 1
    entry:
      kind: step
      id: setup_guard
    edges:
    - source:
        kind: step
        id: setup_guard
      outcome:
        name: success
      target:
        kind: step
        id: read_metrics
    - source:
        kind: step
        id: read_metrics
      outcome:
        name: success
      target:
        kind: step
        id: validate_metrics
    - source:
        kind: step
        id: validate_metrics
      outcome:
        name: success
      target:
        kind: step
        id: compute_kpis
    - source:
        kind: step
        id: compute_kpis
      outcome:
        name: success
      target:
        kind: step
        id: executive_summary
    - source:
        kind: step
        id: executive_summary
      outcome:
        name: success
      target:
        kind: step
        id: validate_model
    - source:
        kind: step
        id: validate_model
      outcome:
        name: success
      target:
        kind: step
        id: render_report
    - source:
        kind: step
        id: render_report
      outcome:
        name: success
      target:
        kind: step
        id: render_subject
    - source:
        kind: step
        id: render_subject
      outcome:
        name: success
      target:
        kind: step
        id: email_report
    - source:
        kind: step
        id: email_report
      outcome:
        name: success
      target:
        kind: step
        id: done
    - source:
        kind: step
        id: setup_guard
      outcome:
        name: error
      target:
        kind: step
        id: failed
    - source:
        kind: step
        id: read_metrics
      outcome:
        name: error
      target:
        kind: step
        id: failed
    - source:
        kind: step
        id: validate_metrics
      outcome:
        name: error
      target:
        kind: step
        id: failed
    - source:
        kind: step
        id: compute_kpis
      outcome:
        name: error
      target:
        kind: step
        id: failed
    - source:
        kind: step
        id: executive_summary
      outcome:
        name: error
      target:
        kind: step
        id: failed
    - source:
        kind: step
        id: validate_model
      outcome:
        name: error
