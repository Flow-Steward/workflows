        id: template
        kind: step
      target:
        id: stop_success
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: validate_urls
        kind: step
      target:
        id: require_urls
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: require_urls
        kind: step
      target:
        id: set_variable
        kind: step
      outcome:
        name: 'true'
    - rework: false
      source:
        id: require_urls
        kind: step
      target:
        id: export_failed
        kind: step
      outcome:
        name: 'false'
    - rework: false
      source:
        id: set_variable
        kind: step
      target:
        id: read_urls
        kind: for_each
      outcome:
        name: success
    - rework: false
      source:
        id: reset_page
        kind: step
      target:
        id: normalize_url
        kind: step
      outcome:
        name: success
    - rework: false
