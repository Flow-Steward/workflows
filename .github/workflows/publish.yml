name: Publish index

on:
  push:
    branches: [main]
    paths:
      - "workflows/**"
      - "categories.json"
      - "scripts/build_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Each item URL pins the commit that last touched its file.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Pinned actions and hash-locked packages: this job holds contents:write.
      - run: pip install --require-hashes -r requirements.txt
      - name: Build index.json
        run: python scripts/build_index.py
      - name: Commit index.json when it changed
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Rebuild index.json"
          git push
