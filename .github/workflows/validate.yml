name: Validate submission

# pull_request_target runs this file and the validator as they are on the base branch,
# so a pull request cannot change the checks that decide whether it passes. The
# separate submission checkout is read as data and never used as a Python import path.
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: validator
    steps:
      - name: Check out the trusted base validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: validator
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -I -m pip install --require-hashes -r requirements.txt
      - name: Test the index builder
        run: python -I -m pytest -q scripts
      - name: Check out the submission as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: submission
          # The base branch is needed to refuse edits to already published files.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the submitted workflows
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: python -I scripts/build_index.py --check --base "$BASE_COMMIT" --submission-root ../submission
      - name: The categories are the extension catalog's
        # One list for both catalogs: change it in Flow-Steward/extensions, then copy it here.
        run: curl -fsSL https://raw.githubusercontent.com/Flow-Steward/extensions/main/categories.json | cmp - ../submission/categories.json
