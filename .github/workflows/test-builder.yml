name: Test index builder

# Run proposed builder code without the privileged submission validator.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-builder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Test the proposed index builder
        run: python -m pytest -q scripts
      - name: Check the current workflow catalog
        run: python scripts/build_index.py --check
